<div class="container-fluid p-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h5 class="fw-bold mb-0"><i class="fa-solid fa-key me-2"></i>Change Password</h5>
                    <small class="text-muted">Update your account password</small>
                </div>
                <button class="btn btn-outline-secondary btn-sm" (click)="cancel()">
                    <i class="fa-solid fa-arrow-left me-1"></i>Back
                </button>
            </div>
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <!-- Server error -->
                    <div *ngIf="serverError" class="alert alert-danger py-2 mb-3">
                        {{ serverError }}
                    </div>
                    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
                        <!-- Current Password -->
                        <div class="mb-3">
                            <label class="form-label fw-medium">Current Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input [type]="showCurrent ? 'text' : 'password'" class="form-control"
                                    placeholder="Enter current password" formControlName="currentPassword"
                                    [class.is-invalid]="f['currentPassword'].touched && f['currentPassword'].invalid" />
                                <button type="button" class="input-group-text bg-white border-start-0"
                                    (click)="showCurrent = !showCurrent">
                                    <i class="fa-regular" [ngClass]="showCurrent ? 'fa-eye-slash' : 'fa-eye'"></i>
                                </button>
                                <div class="invalid-feedback">Current password is required.</div>
                            </div>
                        </div>
                        <!-- New Password -->
                        <div class="mb-3">
                            <label class="form-label fw-medium">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock-open"></i></span>
                                <input [type]="showNew ? 'text' : 'password'" class="form-control"
                                    placeholder="Min. 8 characters" formControlName="newPassword"
                                    [class.is-invalid]="f['newPassword'].touched && f['newPassword'].invalid" />
                                <button type="button" class="input-group-text bg-white border-start-0"
                                    (click)="showNew = !showNew">
                                    <i class="fa-regular" [ngClass]="showNew ? 'fa-eye-slash' : 'fa-eye'"></i>
                                </button>
                                <div class="invalid-feedback" *ngIf="f['newPassword'].errors?.['required']">New password
                                    is required.</div>
                                <div class="invalid-feedback" *ngIf="f['newPassword'].errors?.['minlength']">Minimum 8
                                    characters.</div>
                            </div>
                        </div>
                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label class="form-label fw-medium">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock-open"></i></span>
                                <input [type]="showConfirm ? 'text' : 'password'" class="form-control"
                                    placeholder="Re-enter new password" formControlName="confirmPassword"
                                    [class.is-invalid]="f['confirmPassword'].touched && (f['confirmPassword'].invalid || form.errors?.['mismatch'])" />
                                <button type="button" class="input-group-text bg-white border-start-0"
                                    (click)="showConfirm = !showConfirm">
                                    <i class="fa-regular" [ngClass]="showConfirm ? 'fa-eye-slash' : 'fa-eye'"></i>
                                </button>
                                <div class="invalid-feedback" *ngIf="f['confirmPassword'].errors?.['required']">Please
                                    confirm your password.</div>
                                <div class="invalid-feedback"
                                    *ngIf="!f['confirmPassword'].errors?.['required'] && form.errors?.['mismatch']">
                                    Passwords do not match.</div>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit"
                                class="btn btn-primary flex-grow-1 d-flex align-items-center justify-content-center gap-2"
                                [disabled]="loading">
                                <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
                                {{ loading ? 'Updating...' : 'Update Password' }}
                            </button>
                            <button type="button" class="btn btn-outline-secondary" (click)="cancel()"
                                [disabled]="loading">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
