<div class="login-page d-flex align-items-center justify-content-center">
  <div class="d-flex flex-column align-items-center w-100">
    <div class="login-card card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-3">
                <img src="../../../assets/z7i_logo.png" alt="z7i logo" style="height: 50px;">
                <h1 class="h3 fw-semibold mb-0 mt-2">Login</h1>
            </div>
            <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
                <!-- API/server error message -->
                <div *ngIf="serverError" class="alert alert-danger py-2 mb-3">
                    {{ serverError }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" class="form-control" placeholder="admin@email.com" formControlName="email"
                            [disabled]="loading"
                            [class.is-invalid]="(f['email'].touched || submitted) && f['email'].invalid" />
                        <div class="invalid-feedback"
                            *ngIf="(f['email']?.touched || submitted) && f['email']?.errors?.['required']">
                            Email is required.
                        </div>
                        <div class="invalid-feedback"
                            *ngIf="(f['email']?.touched || submitted) && f['email']?.errors?.['email']">
                            Enter a valid email.
                        </div>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input [type]="showPassword ? 'text' : 'password'" class="form-control" placeholder="••••••••"
                            formControlName="password" [disabled]="loading"
                            [class.is-invalid]="(f['password'].touched || submitted) && f['password'].invalid" />
                        <button type="button" class="input-group-text bg-white border-start-0"
                            (click)="togglePassword()" [disabled]="loading" aria-label="Toggle password visibility">
                            <i class="fa-regular" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                        </button>
                        <div class="invalid-feedback"
                            *ngIf="(f['password']?.touched || submitted) && f['password']?.errors?.['required']">
                            Password is required.
                        </div>
                        <div class="invalid-feedback"
                            *ngIf="(f['password']?.touched || submitted) && f['password']?.errors?.['minlength']">
                            Minimum 6 characters.
                        </div>
                    </div>
                </div>
                <div class="text-end mb-4">
                    <a routerLink="/auth/forgot-password" class="text-muted small text-decoration-none">
                        Forgot password?
                    </a>
                </div>
                <button type="submit"
                    class="btn btn-primary w-100 btn-lg d-flex align-items-center justify-content-center gap-2"
                    [disabled]="loading || form.invalid">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status"
                        aria-hidden="true"></span>
                    <span>{{ loading ? 'Signing In...' : 'Sign In' }}</span>
                </button>
            </form>
        </div>
    </div>
    <a href="/help" target="_blank" rel="noopener" class="help-link mt-3 text-decoration-none">
        <i class="fa-regular fa-circle-question me-1"></i>Need help? Visit the Help Center
    </a>
  </div>
</div>
