<div class="help-page">
  <header class="help-header">
    <div class="brand">
      <i class="fa-solid fa-graduation-cap"></i>
      <span>Help &amp; Tutorials</span>
    </div>
    <p class="tagline">Short videos for every part of the portal</p>
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Search all topics..." [(ngModel)]="search" (ngModelChange)="onSearchChange()" />
    </div>
  </header>

  <div class="help-body">
    <!-- ================= SIDEBAR: MODULES (accordion) ================= -->
    <aside class="help-nav">
      <div class="nav-item" [class.active]="selectedModuleName === null" (click)="selectModule(null)">
        <i class="fa-solid fa-layer-group"></i>
        <span class="nav-name">All Topics</span>
      </div>

      <div *ngIf="loadingModules" class="text-center py-3">
        <div class="spinner-border spinner-border-sm text-primary"></div>
      </div>

      <div class="nav-group" *ngFor="let m of modules">
        <div class="nav-item" [class.active]="selectedModuleName === m.moduleName" (click)="selectModule(m.moduleName)">
          <button type="button" class="chevron-btn" (click)="toggleModuleExpanded(m.moduleName, $event)"
            [attr.aria-label]="isModuleExpanded(m.moduleName) ? 'Collapse' : 'Expand'">
            <i class="fa-solid" [class.fa-chevron-down]="isModuleExpanded(m.moduleName)"
              [class.fa-chevron-right]="!isModuleExpanded(m.moduleName)"></i>
          </button>
          <i class="fa-solid fa-folder-open"></i>
          <span class="nav-name">{{ m.moduleName }}</span>
          <span class="nav-count">{{ m.topicCount }}</span>
        </div>
        <div class="nav-subtopics" *ngIf="isModuleExpanded(m.moduleName)">
          <div class="nav-subtopic" *ngFor="let t of topicsFor(m.moduleName)" (click)="selectModule(m.moduleName)">
            {{ t.topic }}
          </div>
        </div>
      </div>
    </aside>

    <!-- ================= MAIN: TOPIC ACCORDION ================= -->
    <main class="help-content">
      <div *ngIf="loadingTopics" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
      </div>

      <div *ngIf="!loadingTopics && !visibleTopics.length" class="empty-state">
        <i class="fa-solid fa-video-slash"></i>
        <p>No help topics found.</p>
      </div>

      <div class="topic-accordion" *ngIf="!loadingTopics && visibleTopics.length">
        <div class="topic-item" *ngFor="let t of visibleTopics" [class.open]="isTopicExpanded(t)">
          <div class="topic-header" (click)="toggleTopic(t)">
            <i class="fa-solid header-chevron" [class.fa-chevron-down]="isTopicExpanded(t)"
              [class.fa-chevron-right]="!isTopicExpanded(t)"></i>
            <div class="topic-icon"><i class="fa-solid fa-play"></i></div>
            <div class="topic-header-text">
              <div class="v-module">{{ t.moduleName }}</div>
              <div class="v-title">{{ t.topic }}</div>
            </div>
          </div>

          <div class="topic-panel" *ngIf="isTopicExpanded(t)">
            <div class="player-frame" #playerWrapper>
              <!-- YT.Player REPLACES #playerHost with a bare <iframe> (no
                   classes carried over), so a stable wrapper is needed to
                   size/style the resulting iframe — targeting .player-host
                   directly would stop matching anything the moment the
                   player mounts. -->
              <div class="player-host-wrap">
                <div #playerHost></div>
              </div>
              <div class="player-loading" *ngIf="!playerReady">
                <div class="spinner-border spinner-border-sm text-light"></div>
              </div>

              <!-- Custom control bar — controls=0 hides YouTube's native bar
                   entirely (that's the only way to drop Share/Settings,
                   which have no standalone hide parameter), so this
                   replaces play/pause, seek, volume and fullscreen. -->
              <div class="player-controls" *ngIf="playerReady">
                <button type="button" class="ctrl-btn" (click)="togglePlay()"
                  [attr.aria-label]="isPlaying ? 'Pause' : 'Play'">
                  <i class="fa-solid" [class.fa-pause]="isPlaying" [class.fa-play]="!isPlaying"></i>
                </button>

                <span class="ctrl-time">{{ formatTime(currentTime) }}</span>
                <input type="range" class="ctrl-seek" min="0" max="100" step="0.1" [value]="progressPercent"
                  (input)="onSeek($event)" />
                <span class="ctrl-time">{{ formatTime(duration) }}</span>

                <button type="button" class="ctrl-btn" (click)="toggleMute()"
                  [attr.aria-label]="muted ? 'Unmute' : 'Mute'">
                  <i class="fa-solid" [class.fa-volume-xmark]="muted" [class.fa-volume-high]="!muted"></i>
                </button>
                <input type="range" class="ctrl-volume" min="0" max="100" step="1" [value]="volume"
                  (input)="onVolumeChange($event)" />

                <button type="button" class="ctrl-btn" (click)="toggleFullscreen(playerWrapper)"
                  aria-label="Fullscreen">
                  <i class="fa-solid fa-expand"></i>
                </button>
              </div>
            </div>
            <p class="v-desc" *ngIf="t.description">{{ t.description }}</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
