<!-- batch-ptm.component.html -->
<div>

    <!-- ===== FILTERS ===== -->
    <div class="filter-panel">
        <div class="row g-3 align-items-end">

            <!-- Batch multi-select -->
            <div class="col-md-3">
                <app-batch-multiselect [options]="batchOptions" label="Batch" [optional]="true"
                    (selectionChange)="onBatchChange($event)">
                </app-batch-multiselect>
            </div>

            <!-- Date range -->
            <div class="col-md-2">
                <label class="form-label fw-medium">From Date</label>
                <input type="date" class="form-control form-control-sm" [(ngModel)]="fromDate">
            </div>
            <div class="col-md-2">
                <label class="form-label fw-medium">To Date</label>
                <input type="date" class="form-control form-control-sm" [(ngModel)]="toDate">
            </div>

            <!-- Status -->
            <div class="col-md-2">
                <label class="form-label fw-medium">Status</label>
                <select class="form-select form-select-sm" [(ngModel)]="filterStatus">
                    <option value="">All</option>
                    <option value="SCHEDULED">Scheduled</option>
                    <option value="COMPLETED">Completed</option>
                    <option value="CANCELLED">Cancelled</option>
                    <option value="NO_SHOW">No Show</option>
                </select>
            </div>

            <!-- Actions -->
            <div class="col-md-3 d-flex gap-2 align-items-end">
                <button class="btn btn-create fs-16 fw-medium" [disabled]="!canGenerate() || loading"
                    (click)="onGenerateClick()">
                    <span *ngIf="!loading">
                        <i class="fa-solid fa-play me-1"></i> Generate
                    </span>
                    <span *ngIf="loading">
                        <span class="spinner-border spinner-border-sm me-1"></span> Loading...
                    </span>
                </button>

                <button class="btn btn-outline-secondary btn-sm" *ngIf="rows.length > 0" (click)="reset()">
                    <i class="fa-solid fa-rotate-left me-1"></i> Reset
                </button>
            </div>

        </div>
    </div>

    <!-- ===== LOADING ===== -->
    <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="text-muted mt-2">Generating report...</p>
    </div>

    <!-- ===== SUMMARY CARDS ===== -->
    <div *ngIf="summaryItems.length > 0 && !loading" class="row g-3 mb-4">
        <div class="col-sm-6 col-md-3" *ngFor="let item of summaryItems">
            <div class="summary-card">
                <div class="summary-value">{{ item.value }}</div>
                <div class="summary-label">{{ item.label }}</div>
            </div>
        </div>
    </div>

    <!-- ===== EXPORT BUTTONS ===== -->
    <div *ngIf="rows.length > 0 && !loading" class="d-flex gap-2 mb-3">
        <button class="btn btn-outline-danger btn-sm" (click)="exportPdf()">
            <i class="fa-solid fa-file-pdf me-1"></i> Export PDF
        </button>
        <button class="btn btn-export btn-sm" (click)="exportExcel()">
            <i class="fa-solid fa-file-excel me-1"></i> Export Excel
        </button>
    </div>

    <!-- ===== TABLE ===== -->
    <app-report-table [columns]="columns" [rows]="rows" [loading]="loading" [dataLoaded]="dataLoaded"
        emptyHint="Try adjusting the filters or selecting a different date range.">
    </app-report-table>

</div>
