<!-- student-late-entries.component.html -->
<div>
    <div class="filter-panel">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <app-batch-multiselect [options]="batchOptions" label="Batch" [optional]="true"
                    (selectionChange)="onBatchChange($event)"></app-batch-multiselect>
            </div>
            <div class="col-md-3">
                <app-student-multiselect [batchCodes]="selectedBatchCodes" label="Student" [allowManual]="true"
                    [touched]="touched" (selectionChange)="onStudentChange($event)">
                </app-student-multiselect>
            </div>
            <div class="col-md-2">
                <label class="form-label fw-medium">From Date</label>
                <input type="date" class="form-control form-control-sm" [(ngModel)]="fromDate">
            </div>
            <div class="col-md-2">
                <label class="form-label fw-medium">To Date</label>
                <input type="date" class="form-control form-control-sm" [(ngModel)]="toDate">
            </div>
            <div class="col-md-1">
                <label class="form-label fw-medium">Type</label>
                <select class="form-select form-select-sm" [(ngModel)]="filterEntryType">
                    <option value="">All</option>
                    <option value="LATE">Late</option>
                    <option value="EARLY_LEAVE">Early Leave</option>
                </select>
            </div>
            <div class="col-md-1 d-flex gap-2 align-items-end">
                <button class="btn btn-create fs-16 fw-medium" [disabled]="!canGenerate() || loading"
                    (click)="onGenerateClick()">
                    <span *ngIf="!loading"><i class="fa-solid fa-play me-1"></i> Generate</span>
                    <span *ngIf="loading"><span class="spinner-border spinner-border-sm me-1"></span></span>
                </button>
                <button class="btn btn-outline-secondary btn-sm" *ngIf="rows.length" (click)="reset()">
                    <i class="fa-solid fa-rotate-left me-1"></i>
                </button>
            </div>
        </div>
        <div class="mt-2" *ngIf="touched && !selectedAdmissionNos.length">
            <small class="text-danger"><i class="fa-solid fa-circle-info me-1"></i>Please select at least one
                student.</small>
        </div>
    </div>
    <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="text-muted mt-2">Generating report...</p>
    </div>
    <div *ngIf="summaryItems.length && !loading" class="row g-3 mb-4">
        <div class="col-sm-6 col-md-3" *ngFor="let item of summaryItems">
            <div class="summary-card">
                <div class="summary-value">{{ item.value }}</div>
                <div class="summary-label">{{ item.label }}</div>
            </div>
        </div>
    </div>
    <div *ngIf="rows.length && !loading" class="d-flex gap-2 mb-3">
        <button *ngIf="isBulk && detailRows.length" class="btn btn-outline-secondary btn-sm"
            (click)="showDetail = !showDetail">
            <i class="fa-solid fa-list me-1"></i> {{ showDetail ? 'Hide' : 'Show' }} Detail
        </button>
        <button class="btn btn-outline-danger btn-sm" (click)="exportPdf()"><i class="fa-solid fa-file-pdf me-1"></i>
            Export PDF</button>
        <button class="btn btn-export btn-sm" (click)="exportExcel()"><i class="fa-solid fa-file-excel me-1"></i> Export
            Excel</button>
    </div>
    <app-report-table [columns]="activeColumns" [rows]="rows" [loading]="loading" [dataLoaded]="dataLoaded"
        emptyHint="No late entries found for selected students."></app-report-table>
    <div *ngIf="showDetail && detailRows.length" class="report-table-card mt-3">
        <h6 class="fw-semibold mb-3"><i class="fa-solid fa-list me-2 text-primary"></i>Late Entries Detail</h6>
        <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th *ngFor="let col of detailColumns">{{ col.label }}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let row of detailRows">
                        <td *ngFor="let col of detailColumns">{{ row[col.key] ?? '-' }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
