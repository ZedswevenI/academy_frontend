<!-- assignment-reports.component.html -->
<div>
    <div *ngIf="!selectedReport" class="report-grid">
        <div *ngFor="let r of reports" class="report-card" (click)="selectReport(r)">
            <div class="report-card-icon"><i [class]="r.icon"></i></div>
            <div class="report-card-body">
                <div class="report-card-title">{{ r.label }}</div>
                <div class="report-card-desc">{{ r.description }}</div>
            </div>
            <i class="fa-solid fa-chevron-right report-card-arrow"></i>
        </div>
    </div>
    <div *ngIf="selectedReport" class="report-view">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h5 class="fw-bold mb-0"><i [class]="selectedReport.icon + ' me-2'"></i>{{ selectedReport.label }}</h5>
                <small class="text-muted">{{ selectedReport.description }}</small>
            </div>
            <button class="btn btn-back fs-16 fw-medium" (click)="goBack()">
                <i class="fa-solid fa-arrow-left me-1"></i> Back
            </button>
        </div>
        <router-outlet></router-outlet>
    </div>
</div>
