<!-- slash-report.component.html -->
<div>
    <div class="filter-panel">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <app-batch-multiselect [options]="batchOptions" label="Batch" [optional]="false" [required]="true"
                    [touched]="touched" (selectionChange)="onBatchChange($event)"></app-batch-multiselect>
            </div>
            <div class="col-md-2">
                <label class="form-label fw-medium">Subject</label>
                <select class="form-select form-select-sm" [(ngModel)]="filterSubjectId"
                    (ngModelChange)="onSubjectChange($event)">
                    <option value="">All</option>
                    <option *ngFor="let s of subjectOptions" [value]="s.value">{{ s.label }}</option>
                </select>
            </div>
            <!-- Topics — multi-select, only show when subject selected -->
            <div class="col-md-3" *ngIf="filterSubjectId">
                <label class="form-label fw-medium">Topics</label>
                <div *ngIf="topicsLoading" class="form-control form-control-sm text-muted" style="font-size:12px">
                    <span class="spinner-border spinner-border-sm me-1"></span> Loading...
                </div>
                <div *ngIf="!topicsLoading && topicOptions.length" class="border rounded"
                    style="max-height:120px;overflow-y:auto;padding:4px 8px">
                    <div class="d-flex align-items-center py-1 border-bottom" style="cursor:pointer"
                        (click)="toggleAllTopics()">
                        <input type="checkbox" class="form-check-input me-2"
                            [checked]="selectedTopicIds.length === topicOptions.length"
                            [indeterminate]="selectedTopicIds.length > 0 && selectedTopicIds.length < topicOptions.length"
                            readonly>
                        <span class="fw-medium small">All Topics</span>
                    </div>
                    <div *ngFor="let t of topicOptions" class="d-flex align-items-center py-1" style="cursor:pointer"
                        (click)="toggleTopic(t.value)">
                        <input type="checkbox" class="form-check-input me-2" [checked]="isTopicSelected(t.value)"
                            readonly>
                        <span class="small">{{ t.label }}</span>
                    </div>
                </div>
                <small class="text-muted" *ngIf="!topicsLoading && !topicOptions.length">No topics found</small>
            </div>
            <div class="col-md-4 d-flex gap-2 align-items-end">
                <button class="btn btn-create fs-16 fw-medium" [disabled]="!canGenerate() || loading"
                    (click)="onGenerateClick()">
                    <span *ngIf="!loading"><i class="fa-solid fa-play me-1"></i> Generate</span>
                    <span *ngIf="loading"><span class="spinner-border spinner-border-sm me-1"></span> Loading...</span>
                </button>
                <button class="btn btn-outline-secondary btn-sm" *ngIf="rows.length" (click)="reset()">
                    <i class="fa-solid fa-rotate-left me-1"></i> Reset
                </button>
            </div>
        </div>
        <div class="mt-2" *ngIf="touched && !selectedBatchIds.length">
            <small class="text-danger"><i class="fa-solid fa-circle-info me-1"></i>Please select at least one
                batch.</small>
        </div>
    </div>
    <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="text-muted mt-2">Generating report...</p>
    </div>
    <div *ngIf="summaryItems.length && !loading" class="row g-3 mb-4">
        <div class="col-sm-6 col-md-3" *ngFor="let item of summaryItems">
            <div class="summary-card">
                <div class="summary-value">{{ item.value }}</div>
                <div class="summary-label">{{ item.label }}</div>
            </div>
        </div>
    </div>
    <div *ngIf="rows.length && !loading" class="d-flex gap-2 mb-3">
        <button class="btn btn-outline-danger btn-sm" (click)="exportPdf()"><i class="fa-solid fa-file-pdf me-1"></i>
            Export PDF</button>
        <button class="btn btn-export btn-sm" (click)="exportExcel()"><i class="fa-solid fa-file-excel me-1"></i> Export
            Excel</button>
    </div>
    <app-report-table [columns]="columns" [rows]="rows" [loading]="loading" [dataLoaded]="dataLoaded"
        emptyHint="No slash report data found for selected filters."></app-report-table>
</div>
