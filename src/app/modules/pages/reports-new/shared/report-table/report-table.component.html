<div class="report-table-card" *ngIf="rows.length > 0">

    <!-- Table header with record count -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <small class="text-muted">
            <i class="fa-solid fa-table me-1"></i>
            {{ rows.length }} record{{ rows.length === 1 ? '' : 's' }}
        </small>
        <ng-content select="[slot=actions]"></ng-content>
    </div>

    <div class="table-responsive">
        <table class="table table-sm table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th *ngFor="let col of columns">
                        <div class="d-flex align-items-center gap-1">
                            <span>{{ col.label }}</span>
                            <!-- Eye icon for masked columns -->
                            <button *ngIf="col.masked" class="btn btn-sm p-0 ms-1"
                                style="font-size:12px;line-height:1;background:rgba(255,255,255,0.2);border:none;border-radius:3px;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;color:#1c90ff;cursor:pointer;"
                                (click)="toggleReveal(col.key, $event)"
                                [title]="isRevealed(col.key) ? 'Click to mask' : 'Click to reveal'">
                                <i [class]="isRevealed(col.key) ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
                            </button>
                        </div>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let row of rows" [class.fw-semibold]="row._isTotal"
                    [style.background-color]="row._isTotal ? '#f0f4ff' : ''">
                    <td *ngFor="let col of columns">
                        {{ getCellValue(row, col) }}
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Empty state -->
<div *ngIf="!loading && dataLoaded && rows.length === 0" class="text-center text-muted py-5">
    <i class="fa-solid fa-inbox fs-1 d-block mb-3 opacity-50"></i>
    <p class="mb-0">No data found for this report</p>
    <small *ngIf="emptyHint">{{ emptyHint }}</small>
</div>
