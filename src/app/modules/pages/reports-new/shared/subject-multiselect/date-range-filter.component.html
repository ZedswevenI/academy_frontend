<ng-container>
    <div class="col-md-2">
        <label class="form-label fw-medium">
            From Date
            <span class="text-danger" *ngIf="required">*</span>
        </label>
        <input type="date" class="form-control form-control-sm" [class.is-invalid]="showFromError" [ngModel]="fromDate"
            (ngModelChange)="onFromChange($event)">
        <div class="invalid-feedback" *ngIf="showFromError">Required</div>
    </div>
    <div class="col-md-2">
        <label class="form-label fw-medium">
            To Date
            <span class="text-danger" *ngIf="required">*</span>
        </label>
        <input type="date" class="form-control form-control-sm" [class.is-invalid]="showToError" [ngModel]="toDate"
            (ngModelChange)="onToChange($event)">
        <div class="invalid-feedback" *ngIf="showToError">Required</div>
    </div>
</ng-container>
<div class="col-12" *ngIf="required && touched && (!fromDate || !toDate)">
    <small class="text-danger">
        <i class="fa-solid fa-circle-info me-1"></i>
        Date range is required for this report.
    </small>
</div>
`
