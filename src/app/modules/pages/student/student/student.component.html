<div class="ms-3 me-3 pt-1 pb-1">
  <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
    <div class="d-flex flex-column gap-4">
      <!-- Header Section -->
      <div class="d-flex flex-column gap-4">
        <div class="d-flex align-items-center justify-content-between">
          <h1 class="fw-bold mb-0" style="font-size: 30px;">
            <i class="fa-solid fa-user-graduate me-2"></i> My Student
          </h1>
          <!-- <button class="btn btn-newbutton rounded-pill me-1 mb-1 fs-16 fw-medium" type="button">
            <img src="assets/icons/plus.svg" alt="Location" width="20" height="20" class="me-2">
            Add Student</button> -->
          <!-- Right Actions -->
          <div class="d-flex align-items-center gap-3">

            <div class="view-switch">
              <button class="view-btn active" type="button" [ngClass]="{ active: activeTab === 'list' }"
                (click)="setTab('list')">
                <i class="fa-solid fa-list"></i>
                <span>List</span>
              </button>

              <button class="view-btn" type="button" [ngClass]="{ active: activeTab === 'grid' }"
                (click)="setTab('grid')">
                <i class="fa-solid fa-border-all"></i>
                <span>Grid</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="mt-3">
      <!-- <custom-table [autoFitChars]="true" [columns]="columnsArray" [data]="dataArray" [actions]="actions"
        [searchPlaceholder]="'Search StudentName,Batch,...'" [totalRecords]="totalRecords"
        (requestData)="loadTableData($event)"></custom-table> -->
      <ng-container *ngIf="activeTab === 'list'">
        <app-table-list></app-table-list>
      </ng-container>
      <ng-container *ngIf="activeTab === 'grid'">
        <app-grid-list></app-grid-list>
      </ng-container>
    </div>
  </div>
</div>
