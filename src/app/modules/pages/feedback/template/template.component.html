<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">

        <div class="d-flex align-items-center justify-content-between mb-4">
            <h1 class="fw-bold mb-0" style="font-size: 28px;">
                <i class="fa-regular fa-file-lines me-2"></i>Feedback Templates
            </h1>
            <button class="btn btn-newbutton rounded-pill fs-16 fw-medium" (click)="openCreateModal()"
                title="Create a new feedback template">
                <img src="assets/icons/plus.svg" alt="Add" width="20" height="20" class="me-2">
                New Template
            </button>
        </div>

        <custom-table [autoFitChars]="true" [columns]="columnsArray" [data]="dataArray" [showaction]="true"
            success="ACTIVE" primary="INACTIVE" [totalRecords]="totalRecords" (requestData)="loadTableData($event)"
            [actions]="actions" [searchPlaceholder]="'Search templates...'">
        </custom-table>

    </div>
</div>


<!-- ===== CREATE / EDIT TEMPLATE MODAL ===== -->
<div class="modal fade" id="templateFormModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content rounded-4">

            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold">
                    <i class="fa-regular fa-file-lines me-2 text-primary"></i>
                    {{ isEditMode ? 'Edit Template' : 'New Template' }}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body p-4">
                <form [formGroup]="templateForm">
                    <div class="row g-3 mb-4">

                        <!-- Title -->
                        <div class="col-md-6">
                            <formfield label="Template Title" formControlName="title"
                                [control]="templateForm.get('title')" placeholder="e.g. Staff Feedback — Q1 2025"
                                [required]="true">
                            </formfield>
                        </div>

                        <!-- Category -->
                        <div class="col-md-6">
                            <selectbox label="Category" [options]="category_options" formControlName="category"
                                [control]="templateForm.get('category')" [required]="true">
                            </selectbox>
                        </div>

                        <!-- Description -->
                        <div class="col-12">
                            <description label="Description (optional)" formControlName="description"
                                [control]="templateForm.get('description')"
                                placeholder="Brief description of this template...">
                            </description>
                        </div>

                    </div>

                    <!-- Questions -->
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <h6 class="fw-bold mb-0">
                            Questions
                            <span class="badge bg-primary rounded-pill ms-2">
                                {{ questions.length }}
                            </span>
                        </h6>
                        <button type="button" class="btn btn-outline-primary rounded-pill btn-sm"
                            (click)="addQuestion()" title="Add a new question">
                            <i class="fa-solid fa-plus me-1"></i>Add Question
                        </button>
                    </div>

                    <div *ngIf="questions.length === 0" class="text-center text-muted py-3 border rounded-3 mb-3">
                        <i class="fa-solid fa-circle-info me-2"></i>
                        No questions yet — click "Add Question" to start
                    </div>

                    <div formArrayName="questions" class="d-flex flex-column gap-3">
                        <div *ngFor="let q of questions.controls; let i = index" [formGroupName]="i"
                            class="p-3 border rounded-3 bg-light">

                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="fw-semibold small text-muted">Question {{ i + 1 }}</span>
                                <button type="button" class="btn btn-sm btn-outline-danger rounded-pill"
                                    (click)="removeQuestion(i)" title="Remove this question">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>

                            <div class="row g-2">

                                <!-- Field Type -->
                                <div class="col-md-3">
                                    <label class="form-label small fw-medium">
                                        Type <span class="text-danger">*</span>
                                    </label>
                                    <select class="form-select form-select-sm rounded-3" formControlName="fieldType">
                                        <option *ngFor="let t of fieldType_options" [value]="t.value">{{ t.label }}
                                        </option>
                                    </select>
                                </div>

                                <!-- Field Text -->
                                <div class="col-md-9">
                                    <label class="form-label small fw-medium">
                                        Question Text <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control form-control-sm rounded-3"
                                        formControlName="fieldText" placeholder="Enter your question...">
                                </div>

                                <!-- Options (radio/checkbox only) -->
                                <div class="col-12" *ngIf="needsOptions(i)">
                                    <label class="form-label small fw-medium">
                                        Options
                                        <span class="text-muted fw-normal ms-1">
                                            (comma-separated, min 2)
                                        </span>
                                    </label>
                                    <input type="text" class="form-control form-control-sm rounded-3"
                                        formControlName="optionsRaw" placeholder="e.g. Excellent, Good, Average, Poor">
                                    <div class="d-flex flex-wrap gap-1 mt-2" *ngIf="q.get('optionsRaw')?.value">
                                        <span *ngFor="let opt of q.get('optionsRaw')?.value?.split(',') || []"
                                            class="badge bg-white border text-muted small">
                                            {{ opt.trim() }}
                                        </span>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                </form>
            </div>

            <div class="modal-footer border-top">
                <button type="button" class="btn btn-outline-secondary rounded-pill px-4"
                    data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary rounded-pill px-4"
                    [disabled]="templateForm.invalid || !questions.length || saving" (click)="saveTemplate()">
                    <span *ngIf="saving" class="spinner-border spinner-border-sm me-2"></span>
                    {{ saving ? 'Saving...' : (isEditMode ? 'Update Template' : 'Create Template') }}
                </button>
            </div>

        </div>
    </div>
</div>


<!-- DELETE MODAL -->
<div class="modal fade" id="templateDeleteModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 420px;">
        <div class="modal-content rounded-4" *ngIf="templateToDelete">
            <div class="modal-body text-center p-4">
                <div class="mb-3">
                    <span class="d-inline-flex align-items-center justify-content-center
            rounded-circle bg-danger bg-opacity-10" style="width:64px;height:64px;">
                        <i class="fa-solid fa-trash-can text-danger fs-4"></i>
                    </span>
                </div>
                <h5 class="fw-bold mb-1">Delete Template?</h5>
                <p class="fw-semibold mb-1">{{ templateToDelete.title }}</p>
                <p class="text-muted small mb-0">
                    This will fail if any active forms use this template.
                </p>
            </div>
            <div class="modal-footer border-0 justify-content-center gap-2 pb-4">
                <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal"
                    (click)="templateToDelete = null">Cancel</button>
                <button type="button" class="btn btn-danger rounded-pill px-4" data-bs-dismiss="modal"
                    (click)="confirmDelete()">
                    <i class="fa-solid fa-trash-can me-2"></i>Yes, Delete
                </button>
            </div>
        </div>
    </div>
</div>
