<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">

        <!-- Header -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h1 class="fw-bold mb-0" style="font-size: 30px;">
                <i class="fa-regular fa-star me-2"></i>Feedback
            </h1>
            <button *ngIf="showCreate()" class="btn btn-create fs-16 fw-medium"
                routerLink="/app/feedback/create" title="Create a new feedback form" data-bs-toggle="tooltip">
                <img src="assets/icons/plus.svg" alt="Add" width="20" height="20" class="me-2">
                Create Feedback
            </button>
        </div>

        <!-- Filters -->
        <form [formGroup]="filterForm">
            <div class="row align-items-end g-3 mb-4">
                <div class="col-md-4 col-sm-12">
                    <selectbox label="Category" placeholder="All Categories" [options]="category_options"
                        formControlName="category" [control]="filterForm.get('category')">
                    </selectbox>
                </div>
                <div class="col-md-4 col-sm-12">
                    <selectbox label="Status" placeholder="All Statuses" [options]="status_options"
                        formControlName="status" [control]="filterForm.get('status')">
                    </selectbox>
                </div>
                <div class="col-md-4 col-sm-12">
                    <button class="btn btn-create fs-16 fw-medium"
                        [disabled]="loading" (click)="onSearch()">
                        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                        {{ loading ? 'Loading...' : 'Search' }}
                    </button>
                </div>
            </div>
        </form>

        <!-- Table -->
        <custom-table [autoFitChars]="true" [columns]="columnsArray" [data]="dataArray" [showaction]="true"
            [primary]="'ACTIVE'" [success]="'CLOSED'" primary="DRAFT" [totalRecords]="totalRecords"
            (requestData)="loadTableData($event)" [actions]="actions" [searchPlaceholder]="'Search title, category...'"
           (rowClick)="onRowSelected($event)" >
        </custom-table>

    </div>
</div>

<!-- STATUS MODAL -->
<div class="modal fade" id="statusModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
        <div class="modal-content rounded-4" *ngIf="selectedForm">
            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold">
                    <i class="fa-solid fa-toggle-on me-2 text-warning"></i>Change Status
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="p-3 bg-light rounded-3 mb-3">
                    <div class="fw-semibold">{{ selectedForm.title }}</div>
                    <div class="text-muted small">{{ selectedForm.categoryLabel }}</div>
                </div>
                <label class="form-label fw-medium">New Status</label>
                <select class="form-select rounded-3" [(ngModel)]="newStatus">
                    <option value="DRAFT" [disabled]="selectedForm.status === 'CLOSED'">Draft</option>
                    <option value="ACTIVE" [disabled]="selectedForm.status === 'CLOSED'">Active</option>
                    <option value="CLOSED">Closed</option>
                </select>
                <div class="text-muted small mt-2">
                    <i class="fa-solid fa-circle-info me-1"></i>
                    A closed form cannot be reopened.
                </div>
            </div>
            <div class="modal-footer border-top">
                <button type="button" class="btn btn-close-custom fs-16 fw-medium me-2"
                    data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-create fs-16 fw-medium"
                    [disabled]="statusSaving || newStatus === selectedForm.status" (click)="saveStatus()">
                    <span *ngIf="statusSaving" class="spinner-border spinner-border-sm me-2"></span>
                    {{ statusSaving ? 'Saving...' : 'Update Status' }}
                </button>
            </div>
        </div>
    </div>
</div>

<!-- DELETE MODAL -->
<div class="modal fade" id="feedbackDeleteModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 420px;">
        <div class="modal-content rounded-4" *ngIf="formToDelete">
            <div class="modal-body text-center p-4">
                <div class="mb-3">
                    <span class="d-inline-flex align-items-center justify-content-center
            rounded-circle bg-danger bg-opacity-10" style="width:64px;height:64px;">
                        <i class="fa-solid fa-trash-can text-danger fs-4"></i>
                    </span>
                </div>
                <h5 class="fw-bold mb-1">Delete Feedback Form?</h5>
                <p class="fw-semibold mb-1">{{ formToDelete.title }}</p>
                <p class="text-muted small mb-0">This action cannot be undone.</p>
            </div>
            <div class="modal-footer border-0 justify-content-center gap-2 pb-4">
                <button type="button" class="btn btn-close-custom fs-16 fw-medium me-2" data-bs-dismiss="modal"
                    (click)="formToDelete = null">Cancel</button>
                <button type="button" class="btn btn-create fs-16 fw-medium" data-bs-dismiss="modal"
                    (click)="confirmDelete()">
                    <i class="fa-solid fa-trash-can btn-icon"></i>Yes, Delete
                </button>
            </div>
        </div>
    </div>
</div>
