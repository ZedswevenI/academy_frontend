<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-book-open me-2"></i>Create Package
                    </h1>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <form [formGroup]="packCreateForm">
                <div class="row g-3">

                    <div class="col-md-6">
                        <formfield label="Title" formControlName="title" [control]="packCreateForm.get('title')"
                            placeholder="Enter Title" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Due date" formControlName="date" [control]="packCreateForm.get('date')"
                            placeholder="Enter Due date" [required]="true">
                        </formfield>
                    </div>
                    
                    <div class="col-md-6">
                        <selectbox label="Class" [options]="class_options" formControlName="class"
                            [control]="packCreateForm.get('class')" [required]="true">
                        </selectbox>
                    </div>

                    <div class="col-md-6">
                        <multiselect label="Batch" placeholder="Select Batch" [options]="batch_options"
                            formControlName="batch" [control]="packCreateForm.get('batch')" [required]="true">
                        </multiselect>
                    </div>

                    <div class="col-md-6">
                             <importfiles label="Upload Material" [multiple]="false" formControlName="file"
                        (filesChanged)="onFilesSelected($event)">
                    </importfiles>
                    </div>

                    <div class="col-md-6">
                        <description label="Description" placeholder="Type here...." formControlName="desc"
                            [control]="packCreateForm.get('desc')">
                        </description>
                    </div>

                </div>

                <div class="col-12 text-end mt-3">
                    <button class="btn closebutton px-4" style="border-radius: 30px;" routerLink="/app/package">
                        Back
                    </button>
                    <button class="btn submitbutton px-4" [disabled]="packCreateForm.invalid" (click)="addKnowledge()" style="border-radius: 30px;">
                        Submit
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>
