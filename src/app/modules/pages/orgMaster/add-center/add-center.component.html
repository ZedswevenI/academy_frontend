<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-landmark me-2"></i>
                        {{ !isEditMode ? 'Add Center' : 'Edit Center' }}
                    </h1>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <form [formGroup]="centerForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <formfield label="Center Name" formControlName="centerName"
                            [control]="centerForm.get('centerName')" placeholder="Enter Center Name" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <formfield label="Code" formControlName="centerCode" [control]="centerForm.get('centerCode')"
                            placeholder="Enter Code" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <formfield label="City" formControlName="city" [control]="centerForm.get('city')"
                            placeholder="Enter City" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <formfield label="State" formControlName="state" [control]="centerForm.get('state')"
                            placeholder="Enter State" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <formfield label="Phone" formControlName="phone" [control]="centerForm.get('phone')"
                            placeholder="Enter Phone" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6 mt-5">
                        <checkbox label="Active" [required]="false" [control]="centerForm.get('status')"
                            formControlName="status"></checkbox>
                    </div>
                    <div class="col-md-6">
                        <!-- <formfield label="Contact Person" formControlName="cntatName" [control]="centerForm.get('cntatName')"
                            placeholder="Enter Contact Person" [required]="true">
                        </formfield> -->
                        <formfield
  label="Contact Name"
  formControlName="cntatName"
  [control]="centerForm.get('cntatName')"
  placeholder="Enter Contact Name"
  [required]="true">
</formfield>



                    </div>
                    <div class="col-md-6">
                        <formfield label="Area" formControlName="area" [control]="centerForm.get('area')"
                            placeholder="Enter Area" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <formfield label="Pincode" formControlName="pincode" [control]="centerForm.get('pincode')"
                            placeholder="Enter Pincode" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <formfield label="Address Line 1" formControlName="address1"
                            [control]="centerForm.get('address1')" placeholder="Enter Address Line 1" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <formfield label="Address Line 2" formControlName="address2"
                            [control]="centerForm.get('address2')" placeholder="Enter Address Line 2"
                            [required]="false">
                        </formfield>
                    </div>
                </div>

                <div class="col-12 text-end mt-3">
                    <button class="btn closebutton px-4" style="border-radius: 30px;"
                        routerLink="/app/org-master/center">
                        Back
                    </button>
                    <button class="btn submitbutton px-4" [disabled]="centerForm.invalid" (click)="addCenter()"
                        style="border-radius: 30px;">
                        {{ !isEditMode ? 'Submit' : 'Update' }}
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
