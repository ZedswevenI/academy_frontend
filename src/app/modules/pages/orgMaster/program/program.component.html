<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-graduation-cap me-2"></i> Program
                    </h1>
                    <button class="btn btn-newbutton rounded-pill me-1 mb-1 fs-16 fw-medium" type="button" routerLink="/app/org-master/program/add">
                        <img src="assets/icons/plus.svg" alt="Location" width="20" height="20" class="me-2">
                        Add Program</button>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <custom-table [autoFitChars]="true" [columns]="columnsArray" [data]="dataArray" [actions]="actions" [searchPlaceholder]="'Search Center, Code, City...'"></custom-table>
        </div>

    </div>
</div>

 <div>
    <delete [title]="'Delete Program'" [message]="'Are you sure you want to delete this program?'"
        [(visible)]="modalVisible" (closed)="onModalClosed($event)">
    </delete>
</div>
