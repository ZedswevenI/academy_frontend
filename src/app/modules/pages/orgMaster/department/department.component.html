<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-briefcase me-2"></i> Department
                    </h1>
                    <button class="btn btn-newbutton rounded-pill me-1 mb-1 fs-16 fw-medium" type="button"
                        (click)="openCreate()">
                        <img src="assets/icons/plus.svg" alt="Location" width="20" height="20" class="me-2">
                        Add Department</button>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <custom-table [autoFitChars]="true" [loading]="loading" [columns]="columnsArray" [data]="dataArray"
                [actions]="actions" [searchPlaceholder]="'Search Center, Code, City...'" [totalRecords]="totalRecords"
                (requestData)="fetchDepartmentData($event)"></custom-table>
        </div>

    </div>
</div>

<div>
    <delete [title]="deleteTitle" [message]="deleteMessage"
        [(visible)]="modalVisible" (closed)="onModalClosed($event)">
    </delete>
</div>

<!-- Modal -->
<div class="modal fade" id="centerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content modal-xl">
            <div class="modal-header">
                <h5 class="modal-title">
                    {{ isEditMode ? 'Edit Center' : 'Add Center' }}
                </h5>
                <button type="button" class="btn-close" (click)="close()"></button>
            </div>

            <div class="modal-body">
                <form [formGroup]="centerForm">
                    <div class="d-flex g-3 me-2">
                        <div class="me-3">
                            <formfield label="Department Code" formControlName="departmentCode"
                                [control]="centerForm.get('departmentCode')" placeholder="Enter Department Code"
                                [required]="true">
                            </formfield>
                        </div>
                        <div class="me-4">
                            <formfield label="Department Name" formControlName="departmentName"
                                [control]="centerForm.get('departmentName')" placeholder="Enter Department Name"
                                [required]="true">
                            </formfield>
                        </div>
                        <div class="mt-4">
                            <checkbox label="Active" [required]="false" [control]="centerForm.get('isActive')"
                                formControlName="isActive">
                            </checkbox>
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button class="btn closebutton" (click)="close()">Cancel</button>
                <button class="btn submitbutton" (click)="submit()">
                    {{ isEditMode ? 'Update' : 'Save Department' }}
                </button>
            </div>
        </div>
    </div>
</div>
