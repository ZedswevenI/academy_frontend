<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-briefcase me-2"></i> Department
                    </h1>
                    <button class="btn btn-newbutton rounded-pill me-1 mb-1 fs-16 fw-medium" type="button"
                        (click)="openCreate()">
                        <img src="assets/icons/plus.svg" alt="Location" width="20" height="20" class="me-2">
                        Add Department</button>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <custom-table [autoFitChars]="true" [loading]="loading" [columns]="columnsArray" [data]="dataArray" [actions]="actions"
                [searchPlaceholder]="'Search Center, Code, City...'"
                [totalRecords]="totalRecords"
                (requestData)="fetchDepartmentData($event)"></custom-table>
        </div>

    </div>
</div>

<div>
    <delete [title]="'Delete Department'" [message]="'Are you sure you want to delete this department?'"
        [(visible)]="modalVisible" (closed)="onModalClosed($event)">
    </delete>
</div>

<!-- Modal -->
<div class="modal fade" id="centerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content modal-xl">
            <app-create-dep [isEditMode]="isEditMode" [rowData]="selectedRow" (close)="close()" (save)="onSave($event)">
            </app-create-dep>
        </div>
    </div>
</div>
