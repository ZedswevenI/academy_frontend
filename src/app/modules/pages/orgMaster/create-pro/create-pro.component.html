<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-graduation-cap me-2"></i>
                        {{ !isEditMode ? 'Add Program' : 'Edit Program' }}
                    </h1>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <form [formGroup]="proForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <formfield label="Program Name" formControlName="name" [control]="proForm.get('name')"
                            placeholder="Enter Program Name" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <formfield label="Program Code" formControlName="code" [control]="proForm.get('code')"
                            placeholder="Enter Program Code" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <selectbox label="Stream" [options]="stream_options" formControlName="stream"
                            [control]="proForm.get('stream')" [required]="true">
                        </selectbox>
                    </div>
                    <div class="col-md-6">
                        <selectbox label="Eligible Class" [options]="class_options" formControlName="class"
                            [control]="proForm.get('class')" [required]="true">
                        </selectbox>
                    </div>
                    <div class="col-md-6">
                        <selectbox label="Starting Class" [options]="start_options" formControlName="start"
                            [control]="proForm.get('start')" [required]="true">
                        </selectbox>
                    </div>
                    <div class="col-md-6">
                        <selectbox label="Duration Class" [options]="dur_options" formControlName="dur"
                            [control]="proForm.get('dur')" [required]="true">
                        </selectbox>
                    </div>
                    <div class="col-md-6">
                        <formfield label="Ending Class" formControlName="end" [control]="proForm.get('end')"
                            placeholder="Enter Ending Class" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <formfield label="Version" formControlName="version" [control]="proForm.get('version')"
                            placeholder="Enter Version" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <checkbox label="Active" [required]="false" [control]="proForm.get('active')"
                            formControlName="active"></checkbox>
                    </div>
                </div>
                <div class="row g-3">
                    <label class="form-label fw-black fs-9 ms-n3">Subjects</label>
                    <div class="row border p-3">
                        <div class="row d-flex">
                            <div class="col-lg-3">
                                <checkbox label="ENGLISH(ENG)" [required]="false" [control]="proForm.get('eng')"
                                    formControlName="eng"></checkbox>
                            </div>
                            <div class="col-lg-3">
                                <checkbox label="MATHS(MAT)" [required]="false" [control]="proForm.get('math')"
                                    formControlName="math"></checkbox>
                            </div>
                            <div class="col-lg-3">
                                <checkbox label="PHYSICS(PHY)" [required]="false" [control]="proForm.get('phys')"
                                    formControlName="phys"></checkbox>
                            </div>
                            <div class="col-lg-3">
                                <checkbox label="CHEMISTRY(CHEM)" [required]="false" [control]="proForm.get('chem')"
                                    formControlName="chem"></checkbox>
                            </div>
                        </div>
                    </div>
                </div>

                   <div class="col-12 text-end mt-3">
                    <button class="btn closebutton px-4" style="border-radius: 30px;" routerLink="/app/org-master/program">
                        Back
                    </button>
                    <button class="btn submitbutton px-4" [disabled]="proForm.invalid" (click)="addPro()" style="border-radius: 30px;">
                        {{ !isEditMode ? 'Save Program' : 'Update Program' }}
                    </button>
                </div>

            </form>
        </div>

    </div>
</div>
