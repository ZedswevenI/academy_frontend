<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-graduation-cap me-2"></i>Program View
                    </h1>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <div class="row g-3">

                <div class="col-lg-6 col-md-12 mb-3">
                    <div class="row">
                        <label class="col-sm-4 col-form-label">
                            Program Name
                        </label>
                        <div><strong>{{ program.programName }}</strong></div>
                    </div>
                </div>
                <div class="col-lg-6 col-md-12 mb-3">
                    <div class="row">
                        <label class="col-sm-4 col-form-label">
                            Program Code
                        </label>
                        <div><strong>{{ program.programCodes }}</strong></div>
                    </div>
                </div>
            </div>
            <div class="row g-3">
                <div class="col-lg-4 col-md-12 mb-3">
                    <div class="row">
                        <label class="col-sm-4 col-form-label">
                            Stream / Target
                        </label>
                        <div><strong>{{ program.target }}</strong></div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-12 mb-3">
                    <div class="row">
                        <label class="col-sm-4 col-form-label">
                            Version
                        </label>
                        <div><strong>{{ program.version }}</strong></div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-12 mb-3">
                    <div class="row">
                        <label class="col-sm-4 col-form-label">
                            Status
                        </label>
                        <div><strong>{{ program.status }}</strong></div>
                    </div>
                </div>
            </div>
            <div class="row g-3">
                <div class="col-lg-4 col-md-12 mb-3">
                    <div class="row">
                        <label class="col-sm-4 col-form-label">
                            Eligible Class
                        </label>
                        <div><strong>{{ program.eligibleToClass }}</strong></div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-12 mb-3">
                    <div class="row">
                        <label class="col-sm-4 col-form-label">
                            Starting Class
                        </label>
                        <div><strong>{{ program.startingClass }}</strong></div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-12 mb-3">
                    <div class="row">
                        <label class="col-sm-4 col-form-label">
                            Ending Class
                        </label>
                        <div><strong>{{ program.endingClass }}</strong></div>
                    </div>
                </div>
            </div>
            <div class="row g-3">
                <div class="col-lg-4 col-md-12 mb-3">
                    <div class="row">
                        <label class="col-sm-4 col-form-label">
                            Duration (Years)
                        </label>
                        <div><strong>{{ program.duration }}</strong></div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-12 mb-3">
                    <div class="row">
                        <label class="col-sm-4 col-form-label">
                            Subjects
                        </label>
                        <div class="d-flex flex-wrap gap-2">
                            <strong *ngFor="let sub of program?.subjects" class="border rounded px-2 py-1 bg-light">
                                {{ sub.subjectName }}
                            </strong>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 text-end mt-3">
                <button class="btn closebutton px-4" style="border-radius: 30px;" routerLink="/app/org-master/program">
                    Back
                </button>
            </div>
        </div>
    </div>
</div>
