<div class="ms-3 me-3 pt-1 pb-1" *ngIf="material">
  <div class="bg-white rounded-4 shadow-sm p-4 mb-4">

    <h1 class="fw-bold mb-4" style="font-size: 30px;">
      <i class="fa-solid fa-book-open me-2"></i>View Knowledge Base
    </h1>

    <div class="row g-3">

      <!-- Title -->
      <div class="col-lg-6 mb-3">
        <label class="fw-semibold">Title :</label>
        <div><strong>{{ material.title }}</strong></div>
      </div>

      <!-- Available From -->
      <div class="col-lg-6 mb-3">
        <label class="fw-semibold">Available From :</label>
        <div><strong>{{ formatDate(material.availableFrom) }}</strong></div>
      </div>

      <!-- Available Until -->
      <div class="col-lg-6 mb-3">
        <label class="fw-semibold">Available Until :</label>
        <div><strong>{{ formatDate(material.availableUntil) }}</strong></div>
      </div>

      <!-- Class -->
      <div class="col-lg-6 mb-3">
        <label class="fw-semibold">Class :</label>
        <div><strong>{{ material.classNo }}</strong></div>
      </div>

      <!-- Subject -->
      <div class="col-lg-6 mb-3">
        <label class="fw-semibold">Subject :</label>
        <div><strong>{{ material.subjectId.subjectName }}</strong></div>
      </div>

      <!-- Topic -->
      <div class="col-lg-6 mb-3">
        <label class="fw-semibold">Topic :</label>
        <div><strong>{{ material.topicId.topicName }}</strong></div>
      </div>

      <!-- Batch -->
      <div class="col-lg-6 mb-3">
        <label class="fw-semibold">Batch :</label>
        <div><strong>{{ getBatchDisplay() }}</strong></div>
      </div>

      <!-- Description -->
      <div class="col-lg-12 mb-3">
        <label class="fw-semibold">Description :</label>
        <div><strong>{{ material.description || '-' }}</strong></div>
      </div>

      <!-- Attachment -->
      <div class="col-lg-12 mb-3" *ngIf="getAttachmentUrl()">
        <label class="fw-semibold">Document :</label>
        <div>
          <a [href]="getAttachmentUrl()" target="_blank" class="text-primary">
            View / Download File
          </a>
        </div>
      </div>

    </div>

    <div class="text-end mt-4">
      <button class="btn closebutton px-4"
              style="border-radius: 30px;"
              routerLink="/app/knowledge">
        Back
      </button>
    </div>

  </div>
</div>
