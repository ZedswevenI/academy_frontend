<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-layer-group me-2"></i>Edit Batch
                    </h1>
                    <!-- <button class="btn btn-newbutton rounded-pill me-1 mb-1 fs-16 fw-medium" type="button">
            <img src="assets/icons/plus.svg" alt="Location" width="20" height="20" class="me-2">
            Add</button> -->
                </div>
            </div>
        </div>

        <div class="mt-3">
            <form [formGroup]="editBatch">
                <div class="row g-3">
                    <div class="col-md-6">
                        <formfield label="Batch Name" formControlName="name" [control]="editBatch.get('name')"
                            placeholder="Enter Batch Name" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <formfield label="Batch Code" formControlName="code" [control]="editBatch.get('code')"
                            placeholder="Enter Batch Code" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <selectbox label=" Academic Year" placeholder="Select Academic Year" [options]="ay_options"
                            formControlName="academic" [required]="true" [control]="editBatch.get('academic')"> </selectbox>
                    </div>
                    <div class="col-md-6">
                        <selectbox label="Program" placeholder="Select Program" [options]="program_options"
                            formControlName="program" [required]="false" [control]="editBatch.get('program')">
                        </selectbox>
                    </div>
                    <div class="col-md-6">
                        <selectbox label="Center" placeholder="Select Center" [options]="center_options"
                            formControlName="center" [required]="true" [control]="editBatch.get('center')">
                        </selectbox>
                    </div>
                    <div class="col-md-6">
                        <formfield label="Start Date" formControlName="start" [control]="editBatch.get('start')"
                            placeholder="Enter Start Date" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <formfield label="End Date" formControlName="end" [control]="editBatch.get('end')"
                            placeholder="Enter End Date" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <selectbox label="Status" placeholder="Select Status" [options]="status_options"
                            formControlName="status" [required]="true" [control]="editBatch.get('status')">
                        </selectbox>
                    </div>
                    <div class="col-md-6">
                        <formfield label="Remarks" formControlName="remark" [control]="editBatch.get('remark')"
                            placeholder="Enter Remarks" [required]="true">
                        </formfield>
                    </div>
                </div>

                <div class="col-12 text-end mt-3">
                    <button class="btn closebutton px-4" style="border-radius: 30px;" routerLink="/app/batch">
                        Back
                    </button>
                    <button class="btn submitbutton px-4" [disabled]="editBatch.invalid" (click)="updateBatch()" style="border-radius: 30px;">
                        Save
                    </button>
                </div>

            </form>
        </div>


    </div>
</div>
