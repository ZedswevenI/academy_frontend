<form [formGroup]="testForm" class="card shadow-sm p-4">

  <h5 class="mb-3">Create Test</h5>

  <div class="row g-3">

    <div class="col-md-3">
      <label>Class</label>
      <select class="form-select" formControlName="classNo">
        <option value="">Select</option>
        <option *ngFor="let c of classes" [value]="c.value">
          {{ c.label }}
        </option>
      </select>
    </div>

    <div class="col-md-3">
      <label>Subject</label>
      <select class="form-select" formControlName="subjectId">
        <option value="">Select</option>
        <option *ngFor="let s of subjects" [value]="s._id">
          {{ s.subjectName }}
        </option>
      </select>
    </div>

    <div class="col-md-3">
      <label>Topic</label>
      <select class="form-select" formControlName="topicId">
        <option value="">Select</option>
        <option *ngFor="let t of topics" [value]="t.topicId">
          {{ t.topicName }}
        </option>
      </select>
    </div>

    <div class="col-md-3">
      <label>Sub Topic</label>
      <select class="form-select" formControlName="subTopicId">
        <option value="">Select</option>
        <option *ngFor="let st of subTopics" [value]="st.subTopicId">
          {{ st.subTopicName }}
        </option>
      </select>
    </div>

    <div class="col-md-3">
      <label>Exam Category</label>
      <select class="form-select" formControlName="categoryId">
        <option value="">Select</option>
        <option *ngFor="let c of examCategories" [value]="c.categoryId">
          {{ c.categoryName }}
        </option>
      </select>
    </div>

    <div class="col-md-3">
      <label>Exam Sub Category</label>
      <select class="form-select" formControlName="subCategoryId">
        <option value="">Select</option>
        <option *ngFor="let sc of examSubCategories" [value]="sc.subCategoryId">
          {{ sc.subCategoryName }}
        </option>
      </select>
    </div>

    <div class="col-md-3">
      <label>Test Number</label>
      <input class="form-control" formControlName="testNumber">
    </div>

    <div class="col-md-3">
      <label>Test Code</label>
      <input class="form-control" formControlName="testCode">
    </div>

    <div class="col-md-3">
      <label class="form-label">Number of Questions</label>
      <input type="number" formControlName="numberOfQuestions" class="form-control" />
    </div>
  </div>

  <!-- <div class="text-end mt-4">
    <button class="btn btn-primary" (click)="submitTest()">
      Create Test
    </button>
  </div> -->

  <div class="text-end mt-4">
    <button type="button" class="btn btn-primary" [disabled]="testForm.invalid" (click)="submitTest()">
      Create Test
    </button>
  </div>

</form>
