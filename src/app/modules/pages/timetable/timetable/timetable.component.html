<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-calendar-days me-2"></i> Time Table Management
                    </h1>
                    <div class="d-flex align-items-center justify-content-end">
                        <!-- <button class="btn btn-outline-dark fw-bold" style="border: none;"><i class="fa-solid fa-cloud-arrow-up me-1"></i>Upload via CSV</button> -->
                        <button class="btn btn-outline-primary" style="border-radius: 25px;" (click)="openUpload()"><i
                                class="fa-solid fa-cloud-arrow-up me-1"></i>Upload Timetable</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <div class="row g-3">
                <div class="col-lg-8">
                    <form [formGroup]="timetableForm">
                        <filter label1="Program" label2="Batch" label3="Center" [required]="true"
                            [options1]="program_options" [optionLabel1]="'programName'" [optionValue1]="'programId'"
                            [options2]="batch_options" [optionLabel2]="'batchName'" [optionValue2]="'batchId'"
                            [options3]="center_options" [optionLabel3]="'centerName'" [optionValue3]="'centerId'"
                            [placeholder]="'Select'" formControlName="filter" [control]="timetableForm.get('filter')">
                        </filter>
                    </form>
                </div>
                <div class="col-lg-4 mt-5">
                    <button class="btn btn-outline-secondary me-2" style="border-radius: 25px;">Reset</button>
                    <button class="btn submitbutton px-4">Search</button>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <custom-table [autoFitChars]="true" [columns]="columnsArray" [data]="dataArray" [actions]="actions"
                [success]="'Active'" [primary]="'Inactive'" [searchPlaceholder]="'Search Batch, Center,...'"
                [totalRecords]="totalRecords" [loading]="loading" (requestData)="fetchTableData($event)"></custom-table>
        </div>


    </div>
</div>

    <div class="app-modal-backdrop" *ngIf="showUpload">
        <div class="app-modal timetable-modal">

            <div class="app-modal-header d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-0 fw-semibold">Upload Timetable</h6>
                    <span class="text-muted small">Upload CSV to auto-fill details</span>
                </div>
                <button class="btn-close" (click)="closeUpload()"></button>
            </div>

            <div class="app-modal-body">
                <div class="d-flex justify-content-end mb-2">
                    <button class="btn btn-sm btn-link text-decoration-none" (click)="downloadSample()">
                        <i class="fa-solid fa-download me-1"></i> Download Sample CSV
                    </button>
                </div>

                <form [formGroup]="uploadForm" (ngSubmit)="submitUpload()">
                    <div class="row g-3">

                        <div class="col-12">
                            <label class="form-label small fw-bold">Select CSV File</label>
                            <input type="file" class="form-control" accept=".csv" (change)="onFileChange($event)">
                            <div class="form-text small" *ngIf="parsedPayload">
                                <i class="fa-solid fa-check-circle text-success me-1"></i>
                                Parsed successfully: {{ parseStats.periodsFound }} periods across {{
                                parseStats.daysFound }} days.
                            </div>
                        </div>

                        <div class="col-12">
                            <hr class="my-1">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small text-muted">Batch Code *</label>
                            <input class="form-control form-control-sm" formControlName="batchCode">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small text-muted">Center Code *</label>
                            <input class="form-control form-control-sm" formControlName="centerCode">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small text-muted">Week Starting (Monday) *</label>
                            <input class="form-control form-control-sm" type="date" formControlName="wkStartOn">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small text-muted">Phase (Optional)</label>
                            <input class="form-control form-control-sm" formControlName="phase">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary" (click)="closeUpload()">Cancel</button>
                        <button type="submit" class="btn btn-saffron"
                            [disabled]="uploadForm.invalid || !parsedPayload || loading">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Create Timetable
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
