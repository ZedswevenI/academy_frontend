<div class="ms-3 me-3 pt-1 pb-1">
  <div class="bg-white rounded-4 shadow-sm p-4 mb-4">

    <!-- ================= LIST VIEW ================= -->
    <div *ngIf="!showForm">
      <div class="d-flex flex-column gap-4 py-4">
        <div class="d-flex flex-column gap-4">
          <div class="d-flex align-items-center justify-content-between">
            <h1 class="fw-bold mb-0" style="font-size: 30px;">
              <i class="fa-solid fa-clipboard-list me-2"></i>Instructions
            </h1>
            <div class="d-flex">
              <button class="btn btn-back fs-16 fw-medium me-2" type="button"
                (click)="toggleFilters()">
                <i class="fa-solid fa-filter"></i>
                {{ showFilters ? 'Hide Filters' : 'Filters' }}
              </button>
              <button class="btn btn-create fs-16 fw-medium" type="button"
                (click)="openCreateForm()">
                <img src="assets/icons/plus.svg" alt="Add" width="20" height="20" class="me-2">
                Add Instruction
              </button>
            </div>
          </div>

          <!-- Filters -->
          <div class="card shadow-sm border-0 mb-3" *ngIf="showFilters">
            <div class="card-header bg-white border-0">
              <form [formGroup]="filterForm" class="row g-3 align-items-end">

                <div class="col-6 col-md-2">
                  <selectbox label="Status" formControlName="status" [control]="filterForm.get('status')"
                    [options]="statusOptions" optionLabel="label" optionValue="value">
                  </selectbox>
                </div>

                <div class="col-6 col-md-2">
                  <selectbox label="Language" formControlName="language" [control]="filterForm.get('language')"
                    [options]="languageOptions" optionLabel="label" optionValue="value">
                  </selectbox>
                </div>

                <div class="col-md-4 d-flex justify-content-end gap-2 ms-2">
                  <button type="button" class="btn btn-close-custom fs-16 fw-medium me-2" (click)="clearFilters()">
                    Clear
                  </button>
                  <button type="button" class="btn btn-create fs-16 fw-medium" (click)="refresh()">
                    Search
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <custom-table [autoFitChars]="true" [columns]="columnsArray" [data]="dataArray" [actions]="actions"
        [success]="'active'" [primary]="'inactive'" [totalRecords]="totalRecords" [loading]="loading"
        (requestData)="fetchTableData($event)" [searchPlaceholder]="'Search instructions...'" (rowClick)="onRowSelected($event)">
      </custom-table>
    </div>

    <!-- ================= CREATE / EDIT FORM ================= -->
    <div *ngIf="showForm">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="fw-bold mb-0">
          <i class="fa-solid fa-clipboard-list me-2"></i>
          {{ isEditMode ? 'Edit Instruction' : 'Create Instruction' }}
        </h4>
        <button class="btn btn-back fs-16 fw-medium" (click)="closeForm()">
          <i class="fa-solid fa-arrow-left btn-icon"></i> Back
        </button>
      </div>

      <form [formGroup]="instructionForm">
        <div class="row g-3">

          <!-- Title -->
          <div class="col-md-6">
            <label class="form-label">Title <span class="text-danger">*</span></label>
            <input class="form-control" formControlName="title" placeholder="Enter instruction title" />
          </div>

          <!-- Language -->
          <div class="col-md-3">
            <label class="form-label">Language <span class="text-danger">*</span></label>
            <select class="form-select" formControlName="language">
              <option value="en">English</option>
              <option value="hi">Hindi</option>
              <option value="ta">Tamil</option>
            </select>
          </div>

          <!-- Content HTML -->
          <div class="col-12">
            <doceditor label="Content" [required]="true" placeholder="Enter instruction content here..."
              [control]="instructionForm.get('contentHtml')" formControlName="contentHtml"
              id="contentEditor" height="300px" width="100%">
            </doceditor>
          </div>

        </div>

        <div class="text-end mt-4">
          <button type="button" class="btn btn-close-custom fs-16 fw-medium me-2" (click)="closeForm()">
            Cancel
          </button>
          <button type="button" class="btn btn-create fs-16 fw-medium"
            [disabled]="instructionForm.invalid"
            (click)="submitInstruction()">
            {{ isEditMode ? 'Update' : 'Create' }}
          </button>
        </div>
      </form>
    </div>

  </div>

  <!-- ================= VIEW MODAL ================= -->
  <div class="modal-backdrop fade show" *ngIf="showViewModal" (click)="closeViewModal()"></div>
  <div class="modal fade show d-block" tabindex="-1" *ngIf="showViewModal">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">
            <i class="fa-solid fa-clipboard-list me-2"></i>{{ viewData?.title }}
          </h5>
          <button type="button" class="btn-close" (click)="closeViewModal()"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex gap-3 mb-3">
            <span class="badge bg-primary">{{ viewData?.language === 'en' ? 'English' : viewData?.language === 'hi' ? 'Hindi' : 'Tamil' }}</span>
            <span class="badge" [ngClass]="viewData?.status === 'active' ? 'bg-success' : 'bg-secondary'">{{ viewData?.status }}</span>
          </div>
          <hr />
          <div class="instruction-view-content" [innerHTML]="viewContentHtml"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-close-custom fs-16 fw-medium" (click)="closeViewModal()">Close</button>
        </div>
      </div>
    </div>
  </div>

</div>
