<div class="modal-backdrop fade show" *ngIf="show" (click)="close()"></div>
<div class="modal fade show d-block" tabindex="-1" *ngIf="show">
    <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">
                    <i class="fa-solid fa-envelope me-2 text-primary"></i>Send Result Email
                </h5>
                <button type="button" class="btn-close" (click)="close()"></button>
            </div>

            <form [formGroup]="form">
                <div class="modal-body">

                    <div class="alert alert-light border small mb-3">
                        <i class="fa-solid fa-circle-info me-1 text-primary"></i>
                        <ng-container *ngIf="admissionNo">
                            Sends the fixed result-email content to this one student.
                        </ng-container>
                        <ng-container *ngIf="!admissionNo">
                            Sends the fixed result-email content to every student assigned to this exam
                            <span *ngIf="batches.length">— optionally limited to one batch below</span>.
                        </ng-container>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <label class="form-label fs-13 fw-medium">Campaign Title</label>
                            <input class="form-control form-control-sm" formControlName="title"
                                placeholder="Defaults to &quot;{{ examName || 'Exam' }} - Result Mail&quot;" />
                        </div>
                    </div>

                    <div class="row mt-3" *ngIf="!admissionNo && batches.length">
                        <div class="col-md-12">
                            <selectbox label="Limit to Batch (optional)" placeholder="All batches"
                                formControlName="batchId" [options]="batches" optionLabel="label"
                                optionValue="batchId" [control]="form.get('batchId')">
                            </selectbox>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-md-12">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="notifyAbsentees"
                                    formControlName="notifyAbsentees" />
                                <label class="form-check-label" for="notifyAbsentees">
                                    Also notify absent students (sends an "Absence Notice" instead of skipping them)
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-md-6">
                            <selectbox label="Send Type" formControlName="sendType" [options]="sendTypeOptions"
                                optionLabel="label" optionValue="value" [control]="form.get('sendType')"
                                [required]="true">
                            </selectbox>
                        </div>
                        <div class="col-md-6" *ngIf="form.get('sendType')?.value === 'SCHEDULED'">
                            <label class="form-label fs-13 fw-medium">
                                Schedule Date &amp; Time <span class="text-danger">*</span>
                            </label>
                            <input type="datetime-local" class="form-control form-control-sm"
                                formControlName="scheduledAtInput" />
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-close-custom fs-16 fw-medium me-2"
                        (click)="close()">Cancel</button>
                    <button type="button" class="btn btn-create fs-16 fw-medium" [disabled]="loading"
                        (click)="submit()">
                        <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
                        {{ loading ? 'Sending...' : 'Send' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
