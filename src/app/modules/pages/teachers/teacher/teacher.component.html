<div class="ms-3 me-3 pt-1 pb-1">
  <div class="bg-white rounded-4 shadow-sm p-4 mb-4">

    <div class="d-flex flex-column gap-4">
      <div class="d-flex align-items-center justify-content-between">
        <h1 class="fw-bold mb-0" style="font-size: 30px;">
          <i class="fa-solid fa-chalkboard-user me-2"></i> Teacher
        </h1>
      </div>
    </div>

    <div class="mt-3">
      <custom-table [autoFitChars]="true" [columns]="columns" [data]="dataArray" [actions]="actions" [loading]="loading"
        [totalRecords]="totalRecords" [pageSizeOptions]="[10, 20, 50]"
        [searchPlaceholder]="'Search name, staff code, phone...'" (requestData)="fetchTableData($event)"
        (rowClick)="onRowSelected($event)">
      </custom-table>
    </div>

  </div>
</div>
