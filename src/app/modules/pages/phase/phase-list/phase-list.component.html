<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">

        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-hourglass-half me-2"></i>Phase Plan
                    </h1>
                    <button class="btn btn-newbutton rounded-pill me-1 mb-1 fs-16 fw-medium" type="button"
                        routerLink="/app/phase/create">
                        <img src="assets/icons/plus.svg" alt="Add" width="20" height="20" class="me-2">
                        Create Phase Plan
                    </button>
                </div>
            </div>
        </div>

        <!-- Filter Form -->
        <div class="mt-3">
            <form [formGroup]="phaseForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <selectbox
                            label="Class"
                            placeholder="Select Class"
                            formControlName="class"
                            [options]="class_options"
                            [control]="phaseForm.get('class')"
                            [required]="true">
                        </selectbox>
                    </div>
                    <div class="col-md-4">
                        <selectbox
                            label="Subject"
                            placeholder="Select Subject"
                            [options]="subject_options"
                            [optionLabel]="'subjectName'"
                            [optionValue]="'_id'"
                            formControlName="subject"
                            [control]="phaseForm.get('subject')"
                            [required]="true">
                        </selectbox>
                    </div>
                </div>
                <div class="col-12 text-end mt-3">
                    <button
                        class="btn submitbutton px-4"
                        [disabled]="!phaseForm.invalid && loading"
                        (click)="onProceed()"
                        style="border-radius: 30px;">
                        <span *ngIf="loading" class="spinner-border spinner-border-sm me-1" role="status"></span>
                        {{ loading ? 'Loading...' : 'Load Phase Plans' }}
                    </button>
                </div>
            </form>
        </div>

        <!-- Table -->
        <div class="mt-3" *ngIf="isProceed">
            <custom-table
                [autoFitChars]="true"
                [columns]="columnsArray"
                [data]="dataArray"
                [actions]="actions"
                [success]="'Active'"
                [danger]="'Inactive'"
                [totalRecords]="totalRecords"
                [searchPlaceholder]="'Search Phase Name...'"
                (actionClicked)="onAction($event)">
            </custom-table>
        </div>

    </div>
</div>
