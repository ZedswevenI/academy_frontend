<div *ngIf="alert" [ngClass]="{
    'alert': true,
    'bg-success-subtle text-success-emphasis': alert.type === 'success',
    'bg-danger-subtle text-danger-emphasis': alert.type === 'danger',
    'bg-warning-subtle text-warning-emphasis': alert.type === 'warning',
    'custom-alert': true
  }"role="alert"
  style="position: fixed; top: 24px; right: 24px; z-index: 9999; width: auto; min-width: 150px; max-width: 500px; padding: 6px 16px">
  <span>{{ alert.text }}</span>
  <button type="button" class="btn-close float-end" aria-label="Close" (click)="close()"
    style="font-size: 0.8em; margin-left: 10px; margin-top: 2px"></button>
</div>
