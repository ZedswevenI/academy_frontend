<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-book-open me-2"></i>Create Teacher
                    </h1>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <form [formGroup]="teacherForm">
                <div class="row g-3">

                    <div class="col-md-6">
                        <formfield label="Teacher's ID" formControlName="id" [control]="teacherForm.get('id')"
                            placeholder="Enter Teacher's ID" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Teacher Name" formControlName="name" [control]="teacherForm.get('name')"
                            placeholder="Enter Teacher Name" [required]="true">
                        </formfield>
                    </div>
                    
                    <div class="col-md-6">
                        <formfield label="Joined On" formControlName="date" [control]="teacherForm.get('date')"
                            placeholder="Enter Date" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Contact Number" formControlName="num" [control]="teacherForm.get('num')"
                            placeholder="Enter Contact Number" [required]="true">
                        </formfield>
                    </div>
          
                    <div class="col-md-6">
                        <selectbox label="Subject" [options]="subject_options" formControlName="sub"
                            [control]="teacherForm.get('sub')" [required]="true">
                        </selectbox>
                    </div>

                    <div class="col-md-6">
                        <multiselect label="Classes Handle" placeholder="Select Class" [options]="class_options"
                            formControlName="class" [control]="teacherForm.get('class')" [required]="true">
                        </multiselect>
                    </div>

                </div>

                <div class="col-12 text-end mt-3">
                    <button class="btn closebutton px-4" style="border-radius: 30px;" routerLink="/app/teacher">
                        Back
                    </button>
                    <button class="btn submitbutton px-4" [disabled]="teacherForm.invalid" (click)="addTeacher()" style="border-radius: 30px;">
                        Submit
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>
