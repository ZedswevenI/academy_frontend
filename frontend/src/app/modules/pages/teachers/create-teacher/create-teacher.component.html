<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-book-open me-2"></i>Create Teacher
                    </h1>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <form [formGroup]="teacherForm">
                <div class="row g-3">

                    <div class="col-md-6">
                        <formfield label="Teacher Name" formControlName="name" [control]="teacherForm.get('name')"
                            placeholder="Enter Teacher Name" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Staff Code" formControlName="staff" [control]="teacherForm.get('staff')"
                            placeholder="Enter Staff Code" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Employee ID" formControlName="id" [control]="teacherForm.get('id')"
                            placeholder="Enter Teacher's ID" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Phone" formControlName="phone" [control]="teacherForm.get('phone')"
                            placeholder="Enter Phone Number" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Email" formControlName="mail" [control]="teacherForm.get('mail')"
                            placeholder="Enter Email" [required]="true">
                        </formfield>
                    </div>
                    
                    <div class="col-md-6">
                        <formfield label="Center" formControlName="center" [control]="teacherForm.get('center')"
                            placeholder="Enter Address" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Department" formControlName="dep" [control]="teacherForm.get('dep')"
                            placeholder="Enter Department" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Weekoff" formControlName="week" [control]="teacherForm.get('week')"
                            placeholder="Enter WeekOff" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Joining Date" formControlName="join" [control]="teacherForm.get('join')"
                            placeholder="Enter Joining Date" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Relieving Date" formControlName="relieve" [control]="teacherForm.get('relieve')"
                            placeholder="Enter Relieving Date" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Faculty Type" formControlName="type" [control]="teacherForm.get('type')"
                            placeholder="Enter Faculty Type" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Subject" formControlName="sub" [control]="teacherForm.get('sub')"
                            placeholder="Enter Subject" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Update Relieving Date" formControlName="update" [control]="teacherForm.get('update')"
                            placeholder="Enter Update Relieving Date" [required]="true">
                        </formfield>
                    </div>

                </div>

                <div class="col-12 text-end mt-3">
                    <button class="btn closebutton px-4" style="border-radius: 30px;" routerLink="/app/teacher">
                        Back
                    </button>
                    <button class="btn submitbutton px-4" [disabled]="teacherForm.invalid" (click)="addTeacher()" style="border-radius: 30px;">
                        Submit
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>
