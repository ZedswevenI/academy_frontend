<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-hourglass-half me-2"></i>Phase Plan
                    </h1>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <form [formGroup]="phaseForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <selectbox label="Batch" [options]="batch_options" formControlName="batch"
                            [control]="phaseForm.get('batch')" [required]="true">
                        </selectbox>
                    </div>
                    <div class="col-md-4">
                        <selectbox label="Class" [options]="class_options" formControlName="class"
                            [control]="phaseForm.get('class')" [required]="true">
                        </selectbox>
                    </div>
                    <div class="col-md-4">
                        <selectbox label="Subject" [options]="subject_options" formControlName="subject"
                            [control]="phaseForm.get('subject')" [required]="true">
                        </selectbox>
                    </div>
                </div>

                <div class="col-12 text-end mt-3">
                    <button class="btn submitbutton px-4" [disabled]="phaseForm.invalid" (click)="onProceed()"
                        style="border-radius: 30px;">
                        Proceed
                    </button>
                </div>
            </form>
        </div>

        <div class="mt-3" *ngIf="isProceed">
            <custom-table [autoFitChars]="true" [columns]="columnsArray" [data]="dataArray" [actions]="actions" [success]="'Yes'" [danger]="'No'"
                [totalRecords]="totalRecords" (requestData)="loadTableData($event)"
                [searchPlaceholder]="'Search Faculty Name, Program Code...'"></custom-table>
            <!-- <div class="d-flex justify-content-end mt-5">
                <button type="button" class="btn submitbutton px-4">Submit</button>
            </div> -->
        </div>
    </div>
</div>
