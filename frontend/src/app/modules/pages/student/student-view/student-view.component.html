<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-user-graduate me-2"></i>My Student View
                    </h1>
                    <button class="btn closebutton px-4" style="border-radius: 30px;" routerLink="/app/student">
                        Back
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <form>
                <div class="row g-3">
                    <div class="col-lg-6 col-md-12 mb-3">
                        <div class="row">
                            <label class="col-sm-4 col-form-label">
                                ID
                            </label>
                            <span class="col-sm-1 text-center pt-2 d-none d-md-block">:</span>
                            <div class="col-sm-7 pt-2"><strong>ENR2001</strong></div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-12 mb-3">
                        <div class="row">
                            <label class="col-sm-4 col-form-label">
                                Student Name
                            </label>
                            <span class="col-sm-1 text-center pt-2 d-none d-md-block">:</span>
                            <div class="col-sm-7 pt-2"><strong>Priya Sharma</strong></div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-12 mb-3">
                        <div class="row">
                            <label class="col-sm-4 col-form-label">
                                Batch
                            </label>
                            <span class="col-sm-1 text-center pt-2 d-none d-md-block">:</span>
                            <div class="col-sm-7 pt-2"><strong>Batch A</strong></div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-12 mb-3">
                        <div class="row">
                            <label class="col-sm-4 col-form-label">
                                Phone
                            </label>
                            <span class="col-sm-1 text-center pt-2 d-none d-md-block">:</span>
                            <div class="col-sm-7 pt-2"><strong>9876543211</strong></div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-12 mb-3">
                        <div class="row">
                            <label class="col-sm-4 col-form-label">
                                Parent's Number
                            </label>
                            <span class="col-sm-1 text-center pt-2 d-none d-md-block">:</span>
                            <div class="col-sm-7 pt-2"><strong>9876500002</strong></div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-12 mb-3">
                        <div class="row">
                            <label class="col-sm-4 col-form-label">
                                Average Mark
                            </label>
                            <span class="col-sm-1 text-center pt-2 d-none d-md-block">:</span>
                            <div class="col-sm-7 pt-2"><strong>85</strong></div>
                        </div>
                    </div>

                </div>

            </form>
        </div>
    </div>
</div>

<div class="ms-3 me-3 pt-1 pb-1" *ngIf="isPerformance">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-chart-column me-2"></i>Performance
                    </h1>
                </div>
            </div>
            <div class="mt-3">
                <custom-table [autoFitChars]="true" [columns]="columnsArray" [data]="dataArray" [showaction]="false"
                    [searchPlaceholder]="'Search Student, Avg...'" [totalRecords]="totalRecords"
                    (requestData)="loadTableData($event)"></custom-table>
            </div>
        </div>
    </div>
</div>
