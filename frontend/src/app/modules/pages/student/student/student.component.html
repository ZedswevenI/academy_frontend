<div class="ms-3 me-3 pt-1 pb-1">
  <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
    <div class="d-flex flex-column gap-4">
      <!-- Header Section -->
      <div class="d-flex flex-column gap-4">
        <div class="d-flex align-items-center justify-content-between">
          <h1 class="fw-bold mb-0" style="font-size: 30px;">
            <i class="fa-solid fa-user-graduate"></i> My Student
          </h1>
          <!-- <button class="btn btn-newbutton rounded-pill me-1 mb-1 fs-16 fw-medium" type="button">
            <img src="assets/icons/plus.svg" alt="Location" width="20" height="20" class="me-2">
            Add</button> -->
        </div>
      </div>
    </div>
    <div class="mt-3">
      <custom-table [autoFitChars]="true" [columns]="columnsArray" [data]="dataArray" [actions]="actions"
        [searchPlaceholder]="'Search StudentName,Batch,...'" [totalRecords]="totalRecords"
        (requestData)="loadTableData($event)"></custom-table>
    </div>
  </div>
</div>


<!-- POP UP -->
<div *ngIf="isChat" class="chat-float-container">

  <div class="chat-popup card d-flex flex-column">

    <!-- Header -->
    <div class="chat-header d-flex align-items-center justify-content-between px-3 py-2">
      <div class="d-flex align-items-center gap-2">
        <div class="avatar">
          {{ selectedChat?.name?.charAt(0) || 'C' }}
        </div>
        <div>
          <div class="chat-title fw-semibold">
            {{ selectedChat?.name || 'Chat' }}
          </div>
          <small class="text-muted">
            {{ selectedChat?.online ? 'Online' : 'Last seen recently' }}
          </small>
        </div>
      </div>

      <i class="fas fa-times cursor-pointer" (click)="isChat = false"></i>
    </div>

    <!-- Messages -->
    <div class="chat-body flex-grow-1 px-3 py-3 overflow-auto">
      <div *ngFor="let msg of messages"
           class="message-wrapper"
           [class.sent]="msg.sender === 'teacher'"
           [class.received]="msg.sender !== 'teacher'">

        <div class="message-bubble">
          {{ msg.text }}
          <div class="message-time">{{ msg.time }}</div>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input d-flex align-items-center px-3 py-2 gap-2">
      <input
        type="text"
        class="form-control message-input"
        placeholder="Type a message"
        [(ngModel)]="newMessage"
        (keyup.enter)="sendMessage()" />

      <button class="btn send-btn" (click)="sendMessage()">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>

  </div>
</div>
