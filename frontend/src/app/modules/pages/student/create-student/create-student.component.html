<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-user-graduate me-2"></i>Create Student
                    </h1>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <form [formGroup]="studentForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <formfield label="Student Name" formControlName="name" [control]="studentForm.get('name')"
                            placeholder="Enter Student Name" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Admission Number" formControlName="admission"
                            [control]="studentForm.get('admission')" placeholder="Enter Admission Number"
                            [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Program" formControlName="program" [control]="studentForm.get('program')"
                            placeholder="Enter Program" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Center" formControlName="center" [control]="studentForm.get('center')"
                            placeholder="Enter Center" [required]="true">
                        </formfield>
                    </div>

                    <div class="col-md-6">
                        <selectbox label="Status" [options]="status_options" formControlName="status" [required]="true"
                            [control]="studentForm.get('status')"> </selectbox>
                    </div>

                    <div class="col-md-6">
                        <formfield label="Mobile" formControlName="mobile" [control]="studentForm.get('mobile')"
                            placeholder="Enter Mobile" [required]="true">
                        </formfield>
                    </div>
                </div>

                <div class="col-12 text-end mt-3">
                    <button class="btn closebutton px-4" style="border-radius: 30px;" routerLink="/app/student">
                        Back
                    </button>
                    <button class="btn submitbutton px-4" [disabled]="studentForm.invalid" (click)="addStudent()"
                        style="border-radius: 30px;">
                        Submit
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
