<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-building-columns me-2"></i>Edit Institute Information
                    </h1>
                </div>
            </div>
        </div>

        <div class="mt-3 p-4">
            <form [formGroup]="institueForm">
                <div class="row g-3">
                    <div class="col-lg-6">
                        <formfield label="Institute Name" formControlName="institute"
                            [control]="institueForm.get('institute')" placeholder="Enter Institute Name"
                            [required]="true">
                        </formfield>
                    </div>
                    <div class="col-lg-3">
                        <formfield label="Code" formControlName="code" [control]="institueForm.get('code')"
                            placeholder="Enter Code" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-lg-3 mt-4">
                        <checkbox label="Active" [required]="false"
                            [control]="institueForm.get('active')" formControlName="active">
                        </checkbox>
                    </div>
                </div>

                <div class="row g-3 mt-3">
                    <div class="col-lg-6">
                        <formfield label="Address Line1" formControlName="add1" [control]="institueForm.get('add1')"
                            placeholder="Enter Address Line1" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-lg-6">
                        <formfield label="Address Line2" formControlName="add2" [control]="institueForm.get('add2')"
                            placeholder="Enter Address Line2" [required]="false">
                        </formfield>
                    </div>
                </div>

                <div class="row g-3 mt-3">
                    <div class="col-lg-4">
                        <formfield label="City" formControlName="city" [control]="institueForm.get('city')"
                            placeholder="Enter City" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-lg-4">
                        <formfield label="State" formControlName="state" [control]="institueForm.get('state')"
                            placeholder="Enter State" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-lg-4">
                        <formfield label="Pincode" formControlName="pin" [control]="institueForm.get('pin')"
                            placeholder="Enter Pincode" [required]="true">
                        </formfield>
                    </div>
                </div>

                <div class="row g-3 mt-3">
                    <div class="col-lg-6">
                        <formfield label="Contact Email" formControlName="email" [control]="institueForm.get('email')"
                            placeholder="Enter Email" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-lg-3">
                        <formfield label="Phone" formControlName="phone" [control]="institueForm.get('phone')"
                            placeholder="Enter Phone" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-lg-3">
                        <!-- <formfield label="Pincode" formControlName="pin" [control]="institueForm.get('pin')"
                            placeholder="Enter Pincode" [required]="false">
                        </formfield> -->
                    </div>
                </div>

                <div class="col-12 text-end mt-3">
                    <button class="btn closebutton px-4" style="border-radius: 30px;" routerLink="/app/org-master/institute">
                        Back
                    </button>
                    <button class="btn submitbutton px-4" [disabled]="institueForm.invalid" (click)="updateInstitute()"
                        style="border-radius: 30px;">
                        Save Change
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
