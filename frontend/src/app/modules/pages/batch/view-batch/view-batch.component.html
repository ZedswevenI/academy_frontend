<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-layer-group me-2"></i>View Batch
                    </h1>
                    <!-- <button class="btn btn-newbutton rounded-pill me-1 mb-1 fs-16 fw-medium" type="button">
            <img src="assets/icons/plus.svg" alt="Location" width="20" height="20" class="me-2">
            Add</button> -->
                    <button class="btn closebutton" routerLink="/app/batch">Back</button>

                </div>
            </div>
        </div>

        <!-- Heading -->
        <div class="d-flex justify-content-between align-items-center mb-3 mt-3">
            <div class="d-flex align-items-start gap-2">
                <div>
                    <h5 class="mb-0 fw-bold">9th class</h5>
                    <small class="text-muted">
                        9BATCH · 2025 - 2029 · Coimbatore - Sub Main
                    </small>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary" style="border-radius: 25px;" routerLink="/app/batch/edit">
                    <i class="fa-solid fa-edit me-1"></i> Edit Batch
                </button>
                <div class="dropdown">
                    <button class="btn btn-danger dropdown-toggle" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false" style="border-radius: 25px;">
                        <i class="fa-solid fa-gear me-1"></i> Actions
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <button class="dropdown-item text-danger d-flex align-items-center gap-2" routerLink="/app/batch/close">
                                <i class="fa-solid fa-lock"></i>
                                <span>Close Batch</span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="row g-3 mb-4 align-items-stretch">

            <div class="col-md-4 d-flex">
                <div class="card shadow-sm p-3 w-100 h-100">
                    <div class="d-flex align-items-center gap-3 h-100">
                        <div class="icon-circle bg-primary">
                            <i class="fa-solid fa-users"></i>
                        </div>
                        <div>
                            <small class="text-muted">TOTAL STUDENTS</small>
                            <h4 class="mb-0 fw-bold">3</h4>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4 d-flex">
                <div class="card shadow-sm p-3 w-100 h-100">
                    <div class="d-flex align-items-center gap-3 h-100">
                        <div class="icon-circle bg-success">
                            <i class="fa-solid fa-calendar"></i>
                        </div>
                        <div>
                            <small class="text-muted">DURATION</small>
                            <div class="fw-medium">Apr 1, 2026</div>
                            <small class="text-muted">to Mar 31, 2030</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4 d-flex">
                <div class="card shadow-sm p-3 w-100 h-100">
                    <div class="d-flex align-items-center gap-3 h-100">
                        <div class="icon-circle bg-info">
                            <i class="fa-solid fa-chart-line"></i>
                        </div>
                        <div>
                            <small class="text-muted">STATUS</small><br />
                            <span class="badge bg-success">ACTIVE</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>



        <!-- Tabs -->
        <div class="d-flex justify-content-between align-items-center mb-2">
            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#student"><i
                            class="fa-solid fa-graduation-cap me-1"></i>Student</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#faculty"><i
                            class="fa-solid fa-chalkboard-user me-1"></i>Faculty</button>
                </li>
            </ul>
        </div>

        <div class="tab-content">
            <!-- Student -->
            <div class="tab-pane fade show active" id="student">
                <div class="d-flex justify-content-end mb-2">
                    <button class="btn submitbutton" (click)="openStudent()">
                        <i class="fa-solid fa-user-plus me-1"></i> Assign Students
                    </button>
                </div>
                <custom-table [autoFitChars]="true" [columns]="columnsArray" [data]="dataArray" [showaction]="false"
                    [searchPlaceholder]="'Search StudentName,Batch,...'"></custom-table>
            </div>

            <!-- Faculty -->
            <div class="tab-pane fade" id="faculty">
                <div class="row">
                    <div class="d-flex justify-content-end">
                        <button class="btn submitbutton" (click)="openFaculty()">
                            <i class="fa-solid fa-pen me-1"></i> Edit Faculty Map
                        </button>

                    </div>
                    <div class="row g-3">
                        <div class="col-lg-4">
                            <div class="subject-card">
                                <div class="subject-icon">
                                    <i class="fa-solid fa-note-sticky"></i>
                                </div>

                                <div class="subject-content">
                                    <div class="subject-title">PHYSICS</div>
                                    <div class="subject-sub">Saravanakumar</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-4">
                            <div class="subject-card">
                                <div class="subject-icon">
                                    <i class="fa-solid fa-note-sticky"></i>
                                </div>

                                <div class="subject-content">
                                    <div class="subject-title">MATHS</div>
                                    <div class="subject-sub">Rajesh K</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>


    <!-- POP UP -->
    <!-- Assign Student -->
    <div class="drawer-overlay" *ngIf="showStudentPanel" (click)="closeStudent()"></div>
    <div class="assign-drawer" [class.open]="showStudentPanel">

        <div class="drawer-header">
            <h4>Assign Students</h4>
            <i class="fa-solid fa-xmark" (click)="closeStudent()"></i>
        </div>

        <div class="drawer-body">
            <!-- Search -->
            <div class="student-search">
                <input type="text" placeholder="Search..." />
                <button class="go-btn">Go</button>
            </div>

            <!-- Student card -->
            <div class="student-card">
                <label class="student-row">
                    <input type="checkbox" (change)="onStudentToggle($event)" />
                    <div>
                        <div class="student-name">fgsdffs</div>
                        <div class="student-phone">9020642590002</div>
                    </div>
                </label>
            </div>

            <!-- Assign Button -->
            <button class="btn submitbutton w-100">
                Assign {{ selectedCount }} Students
            </button>

        </div>


    </div>

    <!-- Edit Faculty -->
    <div class="drawer-overlay" *ngIf="showFacultyPanel" (click)="closeFaculty()"></div>

    <div class="assign-drawer" [class.open]="showFacultyPanel">

        <div class="drawer-header">
            <h4>Map Faculty</h4>
            <i class="fa-solid fa-xmark" (click)="closeFaculty()"></i>
        </div>

        <div class="drawer-body">
            <form [formGroup]="facultyForm">
                <div class="card p-2">
                    <selectbox label="Subject" placeholder="Select Subject" [options]="subject_options"
                        formControlName="subject" [required]="false" [control]="facultyForm.get('subject')">
                    </selectbox>
                    <selectbox label="Faculty" placeholder="Select Faculty" [options]="faculty_options"
                        formControlName="faculty" [required]="false" [control]="facultyForm.get('faculty')">
                    </selectbox>
                </div>
                <div class="card p-2 mt-3">
                    <selectbox label="Subject" placeholder="Select Subject" [options]="subject_options"
                        formControlName="subject" [required]="false" [control]="facultyForm.get('subject')">
                    </selectbox>
                    <selectbox label="Faculty" placeholder="Select Faculty" [options]="faculty_options"
                        formControlName="faculty" [required]="false" [control]="facultyForm.get('faculty')">
                    </selectbox>
                </div>

                <div class="mt-4">
                    <div class="row">
                        <button class="btn btn-outline-primary mb-2">+ Add Mapping</button>
                    </div>
                    <div class="row">
                        <button class="btn submitbutton w-100">Save Mapping</button>
                    </div>
                </div>
            </form>
        </div>

    </div>
