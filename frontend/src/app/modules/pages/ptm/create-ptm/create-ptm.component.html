<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-people-group me-2"></i>Create PTM
                    </h1>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <form [formGroup]="createPtm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <formfield label="Date" formControlName="date" [control]="createPtm.get('date')"
                            placeholder="Enter Date" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <selectbox label="Class" [options]="class_options" formControlName="class"
                            [control]="createPtm.get('class')" [required]="true">
                        </selectbox>
                    </div>
                    <div class="col-md-6">
                        <formfield label="Time" formControlName="time" [control]="createPtm.get('time')"
                            placeholder="Enter Time" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <selectbox label="Teacher" [options]="staff_options" formControlName="teacher"
                            [control]="createPtm.get('teacher')" [required]="true">
                        </selectbox>
                    </div>
                    <div class="col-md-6">
                        <selectbox label="Mode" [options]="mode_options" formControlName="mode"
                            [control]="createPtm.get('mode')" [required]="true">
                        </selectbox>
                    </div>
                    <div class="col-md-6">
                        <selectbox label="Status" [options]="staff_options" formControlName="status"
                            [control]="createPtm.get('status')" [required]="true">
                        </selectbox>
                    </div>
                </div>

                <div class="col-12 text-end mt-3">
                    <button class="btn closebutton px-4" style="border-radius: 30px;" routerLink="/app/ptm">
                        Back
                    </button>
                    <button class="btn submitbutton px-4" [disabled]="createPtm.invalid" (click)="addPTM()"
                        style="border-radius: 30px;">
                        Submit
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
