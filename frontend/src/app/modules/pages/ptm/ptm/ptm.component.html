<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-people-group me-2"></i>PTM
                    </h1>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <form [formGroup]="ptmForm">
                <filter label1="Class" label2="Batch" label3="Student" [required]="true" [options1]="class_options"
                    [options2]="batch_options" [options3]="student_options" [placeholder]="'Select'"
                    formControlName="filter" [control]="ptmForm.get('filter')"></filter>
                <!-- <div class="row g-3">
                    <div class="col-md-4">
                        <selectbox label="Class" [options]="class_options" formControlName="class"
                            [control]="ptmForm.get('class')" [required]="true">
                        </selectbox>
                    </div>
                    <div class="col-md-4">
                        <selectbox label="Batch" [options]="batch_options" formControlName="batch"
                            [control]="ptmForm.get('batch')" [required]="true">
                        </selectbox>
                    </div>
                    <div class="col-md-4">
                        <selectbox label="Student" [options]="student_options" formControlName="student"
                            [control]="ptmForm.get('student')" [required]="true">
                        </selectbox>
                    </div>
                </div> -->

                <div class="col-12 text-end mt-3">
                    <button class="btn submitbutton px-4" [disabled]="ptmForm.invalid" (click)="onProceed()"
                        style="border-radius: 30px;">
                        Proceed
                    </button>
                </div>
            </form>
        </div>

        <div class="mt-3" *ngIf="isProceed">
            <div class="mt-3 d-flex align-items-end justify-content-end mb-2"> 
                <button class="btn btn-newbutton rounded-pill me-1 mb-1 fs-16 fw-medium" type="button" routerLink="/app/ptm/create">
                <img src="assets/icons/plus.svg" alt="Location" width="20" height="20" class="me-2">
                Add PTM</button>
            </div>
            <custom-table [autoFitChars]="true" [columns]="columnsArray" [data]="dataArray" [actions]="actions"
                success="Completed" primary="Scheduled" [totalRecords]="totalRecords"
                (requestData)="loadTableData($event)"
                [searchPlaceholder]="'Search Class, Batch, Topic...'"></custom-table>
            <div class="d-flex justify-content-end mt-5">
                <button type="button" class="btn submitbutton px-4">Submit</button>
            </div>
        </div>
    </div>
</div>
