<div class="ms-3 me-3 pt-1 pb-1">
  <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
    <div class="d-flex flex-column gap-4">
      <!-- Header Section -->
      <div class="d-flex flex-column gap-4">
        <div class="d-flex align-items-center justify-content-between">
          <h1 class="fw-bold mb-0" style="font-size: 30px;">
            <i class="fa-solid fa-layer-group me-2"></i>Circular
          </h1>
          <!-- <button class="btn btn-newbutton rounded-pill me-1 mb-1 fs-16 fw-medium" type="button">
            <img src="assets/icons/plus.svg" alt="Location" width="20" height="20" class="me-2">
            Add</button> -->
        </div>
      </div>
    </div>
    <div class="mt-3">
      <div class="circular-container mb-4"  *ngFor="let day of circulars">

        <!-- Date Header -->
        <div class="date-pill">{{ day.date }}</div>

        <!-- Circular Items -->
        <div class="circular-item" *ngFor="let item of day.items">
          <div class="timeline-dot" [class.read]="item.isRead"></div>

          <div class="circular-card">
            <p class="circular-text">{{ item.text }}</p>

            <label class="mark-read">
              <input type="checkbox" [checked]="item.isRead" (change)="markAsRead($event, item)">
              <span>Mark as Read</span>
            </label>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
