<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-layer-group me-2"></i>Create Circular
                    </h1>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <form [formGroup]="circularForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <selectbox label="Class" placeholder="Select Class" [options]="class_options"
                            formControlName="class" [required]="true" [control]="circularForm.get('class')">
                        </selectbox>
                    </div>
                    <div class="col-md-6">
                        <formfield label="Title" formControlName="title" [control]="circularForm.get('title')"
                            placeholder="Enter Title" [required]="true"></formfield>
                    </div>
                    <div class="col-md-6">
                        <selectbox label="Type" placeholder="Select Type" [options]="type_options"
                            formControlName="type" [required]="true" [control]="circularForm.get('type')">
                        </selectbox>
                    </div>
                    <div class="col-md-6">
                        <selectbox label="Issued For" placeholder="Select" [options]="issued_options"
                            formControlName="issue" [required]="true" [control]="circularForm.get('issue')">
                        </selectbox>
                    </div>
                    <div class="col-md-6">
                        <formfield label="Date" formControlName="date" [control]="circularForm.get('date')"
                            placeholder="Enter Date" [required]="true"></formfield>
                    </div>
                    <div class="col-md-6">
                        <description label="Description" placeholder="Add description here..."
                            [control]="circularForm.get('des')" formControlName="des" [required]="true">
                        </description>
                    </div>
                </div>

                <div class="col-12 text-end mt-3">
                    <button class="btn closebutton px-4" style="border-radius: 30px;" routerLink="/app/circular">
                        Back
                    </button>
                    <button class="btn submitbutton px-4" [disabled]="circularForm.invalid" (click)="addCircular()"
                        style="border-radius: 30px;">
                        Submit
                    </button>
                </div>

            </form>
        </div>

    </div>
</div>
