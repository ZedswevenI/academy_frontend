<!-- POP UP -->
<div *ngIf="isUnassign" class="assignment-popup-backdrop">
    <div class="assignment-popup card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-primary mb-3">Ticket No : <strong>1002345</strong></h5>
            <span class="close" (click)="onClose()">&times;</span>
        </div>
        <div class="row g-3">
            <div class="col-md-6">
                <div class="border p-3 h-100 bg-light" style="border-radius: 15px;">
                    <p class="mb-1 text-muted">Area</p>
                    <p class="mb-0"><strong>Technical Support</strong></p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="border p-3 h-100 bg-light" style="border-radius: 15px;">
                    <p class="mb-1 text-muted">Subject</p>
                    <p class="mb-0"><strong>Login Issue</strong></p>
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-12">
                <div class="border p-3 h-100 bg-light" style="border-radius: 15px;">
                    <p class="mb-1 text-muted">Details</p>
                    <p class="mb-0"><strong>User unable to login to portal</strong></p>
                </div>
            </div>
        </div>

        <div class="text-end mt-3">
            <button class="btn closebutton" (click)="onClose()">
                Cancel
            </button>
            <button class="btn submitbutton" (click)="onUpdate()">
                Update Status
            </button>
        </div>
    </div>
</div>



<form [formGroup]="supportForm">
    <!-- Status Update -->
    <div *ngIf="isUpdate" class="assignment-popup-backdrop">
        <div class="assignment-popup card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="text-primary mb-3">Update Status</h5>
                <span class="close" (click)="closeUpdate()">&times;</span>
            </div>
            <div class="row g-3">
                <div class="col-md-12">
                    <div class="row">
                        <checkbox label="Mark as Completed" class="mt-2" [required]="false"
                            [control]="supportForm.get('complete')" formControlName="complete">
                        </checkbox>
                    </div>

                    <div class="row">
                        <checkbox label="Mark as not Completed" class="mt-2" [required]="false"
                            [control]="supportForm.get('notComplete')" formControlName="notComplete">
                        </checkbox>
                    </div>

                    <div class="row">
                        <checkbox label="Forward To" class="mt-2" [required]="false"
                            [control]="supportForm.get('forward')" formControlName="forward">
                        </checkbox>
                    </div>
                </div>
            </div>
            <div class="text-end mt-3">
                <button type="button" class="btn closebutton" (click)="closeUpdate()">
                    Cancel
                </button>
                <button  type="button" class="btn submitbutton" (click)="onSubmit()">
                    Submit
                </button>
            </div>
        </div>
    </div>

    <!-- Forward -->
    <div *ngIf="isForward" class="assignment-popup-backdrop">
        <div class="assignment-popup card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="text-primary mb-3">Forward to</h5>
                <span class="close" (click)="closeForward()">&times;</span>
            </div>
            <div class="row g-3">
                <div class="col-md-12">
                    <selectbox label="Employee" [options]="employee_options" formControlName="employee"
                        [control]="supportForm.get('employee')" [required]="true">
                    </selectbox>
                </div>
            </div>
            <div class="text-end mt-3">
                <button  type="button" class="btn closebutton" (click)="closeForward()">
                    Cancel
                </button>
                <button type="button" class="btn submitbutton">
                    Submit
                </button>
            </div>
        </div>
    </div>
</form>
