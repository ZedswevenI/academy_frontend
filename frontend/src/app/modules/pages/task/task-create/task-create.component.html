<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-list-check me-2"></i>Create Task
                    </h1>
                    <!-- <button class="btn closebutton px-4" style="border-radius: 30px;"
                        routerLink="/app/task">Back</button> -->
                </div>
            </div>
        </div>

        <!-- Form -->
        <div class="mt-3">
            <form [formGroup]="taskForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <formfield label="Task" formControlName="task" [control]="taskForm.get('task')"
                            placeholder="Enter Task" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <selectbox label="Faculty" [options]="faculty_options" formControlName="faculty"
                            [control]="taskForm.get('faculty')" [required]="true">
                        </selectbox>
                    </div>
                    <div class="col-md-6">
                        <formfield label="Due Date" formControlName="due" [control]="taskForm.get('due')"
                            placeholder="Enter Due date" [required]="true">
                        </formfield>
                    </div>
                    <div class="col-md-6">
                        <importfiles label="Upload" [multiple]="true" formControlName="file" [required]="true"
                            [control]="taskForm.get('file')" (filesChanged)="onFilesSelected($event)">
                        </importfiles>
                    </div>
                    <div class="col-md-6">
                        <description label="Description" placeholder="Type here...." formControlName="desc"
                            [control]="taskForm.get('desc')">
                        </description>
                    </div>
                </div>

                 <div class="col-12 text-end mt-3">
                    <button class="btn closebutton px-4" style="border-radius: 30px;" routerLink="/app/task">
                        Back
                    </button>
                    <button class="btn submitbutton px-4" [disabled]="taskForm.invalid" (click)="addTask()" style="border-radius: 30px;">
                        Submit
                    </button>
                </div>
                
            </form>
        </div>
    </div>
</div>
