<div class="ms-3 me-3 pt-1 pb-1">
    <div class="bg-white rounded-4 shadow-sm p-4 mb-4">
        <div class="d-flex flex-column gap-4">
            <!-- Header Section -->
            <div class="d-flex flex-column gap-4">
                <div class="d-flex align-items-center justify-content-between">
                    <h1 class="fw-bold mb-0" style="font-size: 30px;">
                        <i class="fa-solid fa-award me-2"></i>Feedback
                    </h1>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <form [formGroup]="feedbackForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <selectbox label="Class" [options]="class_options" formControlName="class"
                            [control]="feedbackForm.get('class')" [required]="true">
                        </selectbox>
                    </div>
                    <div class="col-md-4">
                        <selectbox label="Batch" [options]="batch_options" formControlName="batch"
                            [control]="feedbackForm.get('batch')" [required]="true">
                        </selectbox>
                    </div>
                    <div class="col-md-4">
                        <selectbox label="Student" [options]="student_options" formControlName="student"
                            [control]="feedbackForm.get('student')" [required]="true">
                        </selectbox>
                    </div>
                </div>

                <div class="col-12 text-end mt-3">
                    <button class="btn submitbutton px-4" [disabled]="feedbackForm.invalid" (click)="onProceed()"
                        style="border-radius: 30px;">
                        Proceed
                    </button>
                </div>
            </form>
        </div>

        <div class="mt-3" *ngIf="isProceed">
            <div class="d-flex justify-content-center">
                <div class="feedback-page w-100">

                    <h2 class="title">Submit Feedback</h2>

                    <div class="rating-row">
                        <span class="label">Rating</span>

                        <div class="stars">
                            <i *ngFor="let star of [1,2,3,4,5]" class="fa-solid fa-star" [class.filled]="star <= rating"
                                (click)="setRating(star)">
                            </i>
                        </div>
                    </div>

                    <textarea class="feedback-input" placeholder="Write your feedback here..."  rows="6" [(ngModel)]="comment"></textarea>

                    <button type="button" class="btn submitbutton px-4" (click)="submitFeedback()">Submit Feedback</button>

                </div>
            </div>
        </div>

    </div>
</div>
